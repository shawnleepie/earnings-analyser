extraction_flags:
  - "SEGMENT DISCLOSURE: statutory position UNCHANGED — Note 9 (Operating Segments) confirms SKS continues to report as a single operating segment; wording reverts to 'technology' (matching FY25H1's half-year phrasing) rather than the FY25 annual report's 'IT' — CONFIRMS a repeating stylistic alternation between half-year and annual document wording across two full cycles now, not a one-off drift. The VOLUNTARY non-statutory data-centre-vs-traditional $ revenue split is disclosed at HALF-YEAR granularity for the first time in this backfill (DC $66.5M / Traditional $65.3M, ~50.5%/49.5% split) — previously only available at full-year granularity. No action needed on companies.yaml (segments: [] remains correct)."
  - "DELTA ELCOM ACQUISITION — SUBSEQUENT EVENT, TONE OBSERVATION: legally completed 12 January 2026 (per Note 11), i.e. AFTER the 31 December 2025 half-year end — zero impact on this half's P&L, balance sheet, or cash flow (acquisition_cashflows correctly recorded as 0). However, the investor-presentation.pdf (slide 7, 'Snapshot of progress against strategy') lists 'Acquired Delta Elcom' under the '1H26' column alongside genuinely-in-period achievements, and the CEO commentary in results-announcement.pdf describes it in a way that could read as an in-period achievement rather than a post-period-end completion (the DUE DILIGENCE and negotiation were completed in 1H26; the legal completion was not). Flagged for the disclosure-tone-analyst: this is a genuine, disclosed subsequent event (correctly excluded from the financial statements), but the prominence and placement of the acquisition in the investor-facing narrative is worth noting as a tone point when assessing how the company frames period boundaries. A related administrative item: 'SKS Energy Technologies Pty Ltd' was renamed to 'SKS Technologies NSW Pty Ltd' effective 18 December 2025 (Directors' Report p.7) — an existing subsidiary renamed, not a new entity, likely in preparation for the NSW/Delta Elcom integration."
  - "DEBT/FACILITIES: total CBA-group facility limit rose from $21.0M (FY25 close) through a confirmed two-step path to $32.0M at 1H26 close/report date — (1) the ~$34M revision flagged as a POST-YEAR-END subsequent event in the FY25 file is confirmed to have occurred WITHIN this half (Aug-25), closing that forward-looking flag; (2) the $2.0M overdraft facility was then retired to nil within the same half (given ample cash reserves), landing at the $32.0M figure disclosed in both results-announcement.pdf and investor-presentation.pdf. This is a clean, fully-reconciled two-step revision, NOT a discontinuity. GENUINE GAP: this period's condensed interim report contains NO Note 21-equivalent facility breakdown (no drawn amounts for the overdraft or equipment-finance facilities, only the bank-guarantee drawn amount via the Contingent Liabilities note, and only facility LIMITS via the investor presentation, not the statutory financial statements) — the equipment-finance/lease facility's DRAWN balance at 31 Dec 2025 is NOT independently confirmed this period (last confirmed at $1,644,787 as at 30 June 2025). This mirrors the same disclosure-depth gap flagged in FY25H1, to be closed again only at the FY26 annual report."
  - "NTA/SHARE INTERNAL DISCREPANCY: the ASX-lodged, statutory Appendix 4D figure (20.63 cents) and the investor-presentation.pdf's own Key financial metrics table (21.05 cents) disagree for the 1H26 current period specifically (a ~0.42c/2.0% gap), while both documents agree exactly on the 1H25 and FY25 comparatives. Treated the statutory Appendix 4D figure as authoritative; the source of the discrepancy is not explained in either document."
  - "PBT/NPAT MARGIN CONVENTION CLARIFIED: this period's investor-presentation.pdf (p.4/p.20) is the first document in the backfill to explicitly label its margin denominators, revealing that PBT margin and NPAT margin are computed on a TOTAL-REVENUE basis (sales + other income), while EBITDA margin and EBIT margin are computed on a SALES-REVENUE-ONLY basis — a subtle inconsistency in the company's own convention that was invisible in prior periods (where other income was too small to matter) but now creates an ~8bp gap for PBT margin (9.63% total-revenue-basis vs 9.71% sales-revenue-basis) as interest income has grown. No restatement of prior periods needed (FY25's gap under either basis is negligible: 7.90% vs 7.94%), but flagged for the profitability-earnings-analyst to use the TOTAL-REVENUE basis for PBT/NPAT margin comparability with the company's own quoted figures (9.6%, 7.2%, 3.4%, 0.9%, 3.1% for 1H26 through 1H22) and the SALES-REVENUE basis for EBITDA/EBIT margins, going forward."
  - "EBITDA/EBIT METHODOLOGY — HIGHEST-CONFIDENCE CONFIRMATION YET: investor-presentation.pdf p.21 presents EBITDA and EBIT as explicit named line items in the company's own historical P&L table for the first time in the backfill (rather than only narrative/chart references), and both tie EXACTLY (to the dollar) to the net-of-interest-income finance-cost basis established in FY25H1 and confirmed for FY25. NEW/AMPLIFIED QoE POINT: net finance is an INCOME of $544,179 for this half alone — already larger than the FULL-YEAR FY25 net finance income of $149,990 — continuing to widen the gap between EBIT (now structurally BELOW PBT) and PBT, driven entirely by interest earned on the growing cash pile (not operating performance). This is a structural, growing, balance-sheet-driven tailwind that should be isolated in any underlying-earnings-quality assessment; it is likely to keep growing while the company remains debt-free and cash-accumulating."

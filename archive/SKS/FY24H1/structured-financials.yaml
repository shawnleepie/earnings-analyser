extraction_flags:
  - "Only source document for this period is a 4-page ASX press release (results-announcement.pdf), not full interim financial statements — no appendix-4D, financial-statements.pdf, investor-presentation.pdf, or transcript.pdf located (per metadata.yaml). As a direct consequence, most balance-sheet detail (trade debtors/creditors, inventory, contract assets/liabilities, provisions, goodwill/intangibles carrying value, impairment) and cash-flow detail (capex split, free cash flow, acquisition and financing cash flow lines) are recorded not_available in structured-financials.yaml — this is a document-availability gap, not a parsing failure. Recommend a follow-up document-fetcher pass specifically for the SKS 31 Dec 2023 Appendix 4D / interim financial report before relying on this period for balance-sheet or cash-flow analysis."
  - "metadata.yaml's 'notes' field contains a factual error carried over from the original archiving run: it states EPS grew '1.64c (1H23) to 3.28c (1H24)'. Those figures are actually Net Tangible Assets per share (p.2 of the release), not EPS. The document's own EPS chart (p.2) shows EPS of 0.37c (1H23) growing to 1.66c (1H24) — this is what has been recorded in this structured-financials.yaml. Recommend correcting metadata.yaml's notes field to avoid this error propagating into the analysis stage."
  - "No divisional/segment revenue split disclosed in dollar terms — consistent with FY23 single-segment reporting. The release does disclose a 'work on hand' (backlog) composition by sector (traditional/defence/smart building networks/data centres) at three points in time (Aug-2022, Aug-2023, Feb-2024) — this is pipeline mix, not a revenue segment breakdown, and has been kept separate in this file to avoid conflation. companies.yaml segments: [] remains correct for SKS at this period; no update made."
  - "No gross profit / cost-of-sales line disclosed (consistent with FY23 nature-of-expense presentation, though full interim accounts were not available to confirm the format continued unchanged)."
  - "No EBIT or net interest expense disclosed separately — EBITDA less PBT implies a combined D&A + net interest of ~$1.17M for the half but this has not been presented as an EBIT figure to avoid false precision."
  - "Tax: company states 1H24 before-tax profit ($1.82M) 'also equalled after-tax profit', i.e. nil net tax impact for the half — recorded as tax = 0 (income tax expense), sourced to that explicit statement rather than a tax note (none available)."
  - "DPS not confirmed for 1H24 — no dividend (declared or paid) is mentioned anywhere in this release. Whether the $0.002/share dividend declared 30 Aug 2023 (per FY23 file, a post-FY23-balance-date event) was actually paid during 1H24, or whether a separate FY24 interim dividend was declared, is unconfirmed from this source."
  - "CONTINUITY CHECK vs FY23 (financial-statements.pdf, prior structured-financials.yaml) — CASH: PASS. FY23 closing cash $8,584 reconciles to this release's stated 1H24 opening cash of '$0.01 million' (rounds correctly)."
  - "CONTINUITY CHECK vs FY23 — DEBT: explained change, not a discontinuity. FY23 closing CBA overdraft drawn was $1,761,250 (of a $5M limit); this release states the overdraft was fully repaid to $0 drawn by 31 Dec 2023, and total CBA facilities were simultaneously expanded from $8M to $12M (new $2M equipment leasing facility + bank guarantee limit raised $3M -> $5M). This is a genuine, company-disclosed deleveraging/facility-expansion event, not an extraction error — flagging per project convention since it's a material discontinuity in the debt profile, even though it's explained."
  - "net_debt could not be derived on a like-for-like basis with the FY23 'net_debt_including_leases' figure ($7,374,478) because lease liabilities are not disclosed in this press-release-only source. Recorded as not_available rather than presenting a partial (borrowings-only) figure as if it were comparable to the FY23 metric."
  - "FY24 full-year revenue guidance disclosed by the Board: 'a more realistic revenue target for FY24 is in the vicinity of $120 million plus' (results-announcement.pdf p.3) — not an actual result, but material context for guidance-vs-consensus analysis in a later stage."
  - "Consensus not queried — FactSet MCP requires OAuth authentication not completed this session (per task instructions, not re-attempted mid-extraction); same as FY23 treatment."

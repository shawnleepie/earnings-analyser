balance_sheet:
  cash:
    value: 900000
    precision: "disclosed only to 2dp $M ('$0.90 million')"
    source: "results-announcement.pdf p.2 ('Cash in hand was $0.90 million as at 31 December 2023, up from $0.01 million as at the beginning of the half')"
    continuity_check_vs_fy23: "PASS — opening-of-half cash of '$0.01 million' stated here reconciles to FY23 closing cash of $8,584 (financial-statements.pdf p.34/Note 9, prior structured-financials.yaml), which rounds to $0.01M. No discontinuity."
  total_debt_by_facility:
    cba_overdraft_facility:
      drawn: 0
      limit: 5000000
      undrawn: 5000000
      maturity_date: not_disclosed
      interest_rate: not_disclosed
      fixed_or_floating: "floating (per FY23 disclosure; not restated in this release)"
      source: "results-announcement.pdf p.2 ('no outstanding amount on its overdraft as at the end of the half year'); limit inferred unchanged at $5M — see facility note below"
    cba_bank_guarantee_facility:
      limit: 5000000
      drawn: not_disclosed
      undrawn: not_disclosed
      source: "results-announcement.pdf p.2 ('a $2 million increase in the existing bank guarantee facility to $5 million')"
    cba_equipment_leasing_facility:
      facility_type: "new facility, established during 1H24"
      limit: 2000000
      drawn: not_disclosed
      source: "results-announcement.pdf p.2 ('The increase consisted of a $2 million equipment leasing facility and a $2 million increase in the existing bank guarantee facility to $5 million')"
    total_cba_facility_limit:
      value: 12000000
      source: "results-announcement.pdf p.2 ('the company secured an additional $4 million in total facilities under the existing Commonwealth Bank agreement, bringing the CBA financing facilities to a total of $12 million')"
    continuity_check_vs_fy23: "PASS (explained change, not a discontinuity). FY23 closing total facility was $8M ($5M overdraft + $3M bank guarantee, drawn $1,761,250 + $2,165,632 = $3,926,882). 1H24: overdraft fully repaid to $0 drawn; bank guarantee limit raised $3M->$5M; new $2M equipment leasing facility added. Total limit $8M -> $12M, exactly the stated '+$4 million'. This is a genuine deleveraging/facility-expansion event explicitly disclosed by the company, not an extraction error."
    note: "Overdraft limit of $5M is inferred (not explicitly restated in this release) from total facility arithmetic: $12M total - $5M bank guarantee - $2M equipment lease = $5M, unchanged from FY23. Not treated as company-confirmed to the same standard as the other two figures — flagged."
  net_debt:
    value: not_available
    partial_basis: "Borrowings-only view: overdraft drawn $0 less cash $900,000 = net cash position of -$900,000 (i.e. net cash, not net debt). Lease liabilities (a material component of FY23 net debt, $5.6M at 30 June 2023) are NOT disclosed in this release, so a like-for-like net debt figure (as computed in the FY23 file, 'net_debt_including_leases') cannot be derived this half."

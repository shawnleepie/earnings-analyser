extraction_flags:
  - "investor-presentation.pdf, results-announcement.pdf (standalone), appendix-4e.pdf (standalone), and transcript.pdf not located for FY25 (carried over from metadata.yaml) — however, the Appendix 4E headline summary (p.1) and all MD&A-equivalent content (financial performance charts, work-on-hand, sector splits, bank-facility timeline) that would typically appear in an investor presentation ARE present within financial-statements.pdf's front-matter sections (pp.3-17), so this is a lesser document-availability gap than FY25H1's (where the voluntary data-centre revenue split was genuinely unavailable)."
  - "SEGMENT DISCLOSURE: statutory position UNCHANGED — Note 22 (Operating Segment) confirms SKS continues to report as a single operating segment; wording reverted to 'IT' (from FY25H1's 'technology'), an immaterial editorial drift consistent with the FY23/FY24 wording. companies.yaml segments: [] correctly NOT changed. The VOLUNTARY non-statutory data-centre-vs-traditional $ revenue split (absent in FY25H1 due to no investor presentation being lodged that half) has RETURNED this period, disclosed directly within the annual report itself (p.12): data centre revenue $140.7M (53.8% of sales), traditional ~$121M (46.2%). No action needed on companies.yaml, but worth noting the disclosure practice survives document-format changes (deck vs annual report) even though it briefly appeared absent."
  - "EBITDA/EBIT METHODOLOGY — CONFIRMED FOR FULL YEAR: the company's own disclosed EBITDA ($23.47M) and EBIT ($20.64M) figures for FY25 tie to the NET-of-interest-income finance-cost basis (PBT + D&A + [finance costs less interest income]), confirming the methodology point first identified in FY25H1 now holds for a full annual disclosure, not just a half-year one. NEW THIS PERIOD: FY25 is the first full year where interest income ($797,879) exceeds gross finance costs ($647,889), meaning EBIT is now LOWER than PBT (net finance is an INCOME, not a cost) — the reverse of the conventional relationship, driven by interest earned on the much larger cash pile rather than any operating change. Flagged to the profitability-earnings-analyst as a genuine, quantifiable, balance-sheet-driven (not operating) item to isolate when assessing underlying earnings quality; also flagged that the FY24 structured-financials.yaml's PRIMARY EBITDA/EBIT figures were computed on the GROSS-finance-cost basis (a different but then-immaterial convention) — a multi-period EBITDA/EBIT trend line should be rebuilt on a single consistent (net) basis before use, using the comparative figures recomputed on net-basis in this file's ebitda/ebit notes."
  - "TAX: effective rate of 32.51% for FY25 (vs a statutory 30% rate and vs FY24's anomalous -1.94% one-off benefit) — Note 7(a) shows the small premium over statutory rate is driven by permanent differences ($266,683) and prior-period temporary-difference true-ups ($275,221), not a new one-off item. This is a clean, representative full-year tax rate — no further one-off DTA-type benefits/charges evident, unlike FY24."
  - "DEBT/FACILITIES: total CBA facility limit of $21M (as disclosed in FY25H1's results-announcement.pdf) is CONFIRMED UNCHANGED at FY25 year-end via Note 21(c), closing the sub-facility-composition gap flagged in FY25H1 (no breakdown was available for that half). Full FY25 breakdown: overdraft $2.0M limit/$0 drawn (cut from $2.5M limit), bank guarantee $17.0M limit/$11.69M drawn (up from $10.0M/$7.99M), bank lease/equipment facility $2.0M limit/$1.64M drawn (up from $2.0M/$0.81M). Total facilities in use $13.33M against $21.0M limit = $7.67M undrawn headroom. A further facility increase to ~$34M total (guarantee to $28M, lease to $4M) is a POST-YEAR-END subsequent event (25 Aug 2025), not reflected in the FY25 balance sheet — relevant for FY26H1's opening facility position."
  - "GOODWILL: FY25H1's INFERRED goodwill figure of $1,867,660 (unconfirmed at the time, no interim intangibles-breakdown note available) is now CONFIRMED DIRECTLY via Note 14(a) — unchanged throughout FY25. The FY25H1 inference methodology (no acquisition activity + minor intangibles movement consistent with capitalised software) is validated as sound."
  - "IMPAIRMENT: first period in the backfill with a full formal impairment-testing note directly available (Note 14) — confirmed NIL impairment, with recoverable amount of the single CGU ($60.24M) more than 32x the carrying goodwill ($1.87M), even wider headroom than FY24's flagged >14x. Sensitivity analysis confirms no impairment even under a 5%-higher discount rate."

  - "TRADE PAYABLES: FY24 comparative trade-payables figure in this FY25 report's Note 15 ($19,200,071) differs by ~$15,000 from the figure recorded in the FY24 structured-financials.yaml ($19,215,071) — an immaterial (<0.1%) discrepancy, likely a minor reclassification between 'Trade payables' and 'Other payables' sub-lines between the two years' note formats rather than a restatement or extraction error. Flagged for completeness, not treated as a concern."
  - "INVENTORY: unusually large HoH swing (-89.3%, from $406,921 at 1H25 to $43,432 at FY25 close) on a small-dollar, non-core balance ('project materials at the warehouse') — plausible given the balance's small absolute size and project-timing nature, but flagged given the magnitude of the percentage swing."

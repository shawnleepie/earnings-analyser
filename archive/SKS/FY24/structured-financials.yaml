    continuity_check_vs_fy24h1: "EXPLAINED CHANGE, NOT A DISCONTINUITY, but flagged because the composition shifted materially, not just the total. FY24H1 (31 Dec 2023, per results-announcement.pdf and the FY24H1 structured-financials.yaml) disclosed a total facility of $12m, inferring an unchanged $5m overdraft limit + $5m bank guarantee + $2m new equipment leasing facility. The investor-presentation.pdf facility-timeline chart (p.7) confirms this $12m/Nov-23 breakdown exactly (overdraft $5m, guarantee $5m, equipment finance $2m) — so the FY24H1 file's inferred $5m overdraft figure was correct as at Dec-23. However, between Nov-23 and the FY24 year-end (May-24 per the same chart), the facility was restructured again: total rose to $14.5m, but the OVERDRAFT limit was CUT from $5m to $2.5m while the bank guarantee limit was raised disproportionately from $5m to $10m (the equipment finance facility stayed at $2m). Net effect: total headroom grew, but overdraft (cash-drawable) capacity actually fell — the growth in facility headroom is almost entirely in the bank guarantee line, which makes sense given the guarantee facility is what backs large data-centre-contract performance bonds (drawn guarantee usage grew from $2,165,632 at FY23 to $7,990,977 at FY24). Not an extraction error — confirmed independently by two documents (Note 21 and the investor presentation chart) — but flagged since a naive reader could assume the FY24H1 $12m facility simply grew pro-rata to $14.5m, when in fact one sub-limit was cut."

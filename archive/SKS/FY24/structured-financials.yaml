extraction_flags:
  - "Full document set (financial-statements.pdf, results-announcement.pdf, appendix-4e.pdf, investor-presentation.pdf) was available for FY24, unlike FY23 and FY24H1 which each had only one source document — this is the first period in the backfill with materially complete balance-sheet and cash-flow detail. No transcript.pdf located (per metadata.yaml)."
  - "NEW VOLUNTARY DISCLOSURE — investor-presentation.pdf p.6 discloses, for the first time, a dollar revenue split between 'data centre revenue' ($31M, 22.8% of FY24 sales) and 'traditional SKS revenue' ($105M, +26.5% YoY). This is NOT a formal AASB 8 segment (Note 22 of the audited accounts continues to state single-segment reporting, unchanged wording from FY23) — it is presentation-only. Flagged per project convention as a disclosure to monitor: if this split is formalised into segment notes in a future period, companies.yaml segments: [] for SKS should be updated at that point. Not changed this period since the statutory basis is unchanged."
  - "Bank facility composition changed materially within 2H24, not just in aggregate — flagged in detail under balance_sheet.total_debt_by_facility.continuity_check_vs_fy24h1. Total facility grew from $12m (Nov-23) to $14.5m (May-24, confirmed by investor-presentation.pdf p.7 timeline chart), but the overdraft sub-limit was actually CUT from $5m to $2.5m while the bank guarantee sub-limit nearly doubled from $5m to $10m. A naive reader assuming pro-rata growth across sub-facilities would be wrong; the growth is concentrated in the guarantee facility (which backs data-centre-contract performance bonds)."
  - "Income tax benefit of $125,817 (effective tax rate -1.94%) includes a one-off $1,118,946 credit for 'Temporary differences from prior periods not previously booked' (Note 7(a)) plus utilisation of the full $1,665,000 opening recognised tax-loss deferred tax asset. This is a non-recurring benefit for QoE purposes — flagged for the profitability-earnings-analyst, since the scale of this benefit will not repeat once prior-period adjustments and carried-forward losses are exhausted."
  - "Two different dividends must not be conflated (same risk as the EPS/NTA mislabelling flagged in FY24H1): (1) $0.20c/share unfranked, $219,470, paid 17 Oct 2023 — this is the FY23-related dividend, already flagged as a subsequent event in the FY23 file, now confirmed paid during FY24 (continuity PASS); (2) $1.00c/share fully franked, declared 19 Aug 2024 — this is the NEW FY24-related dividend, a subsequent event not yet reflected in the 30 June 2024 balance sheet, and notably absent from Appendix 4E s.2's dividend table (which only shows dividend (1))."
  - "investor-presentation.pdf p.17 historical P&L appendix shows FY23 finance charges as '(722.1)' vs the audited financial-statements.pdf figure of $772,130 (also used identically in the FY23 structured-financials.yaml) — apparent transposition typo in the deck (722 vs 772). Not used; audited figure used throughout this file. Similarly, the same appendix's FY20/FY21 sales revenue figures ($26,551.1k / $35,599.2k) differ slightly from the Directors' Report KPI table figures used here ($36,173,248 / $36,299,131) — appears to reflect a 'continuing operations' restatement following a flagged 'wholesale company restructure' in FY20, not relevant to FY23/FY24 which agree across all sources."
  - "Employee headcount is disclosed two ways for the same 30 June 2024 date: 739 'effective fulltime highly qualified employees' (Directors' Report) vs 622 FTEs (investor presentation, up from 305 FTEs at June 2023). Not reconciled from available documents — flagged rather than assuming either supersedes the other."
  - "No gross profit / cost-of-sales line disclosed — nature-of-expense P&L format unchanged from FY23. No maintenance-vs-growth capex split disclosed — unchanged flag from FY23."
  - "No formal gearing ratio disclosed by the company (unchanged from FY23) — Return on Capital Employed % (38% FY24 vs 26% FY23) and Operating Margin % (4.8% FY24 vs 0.6% FY23) are the only company-disclosed non-GAAP performance ratios, recorded as non-schema metrics in balance_sheet above."
  - "CONTINUITY CHECK SUMMARY vs FY23 (prior structured-financials.yaml): CASH — PASS (exact tie-out, $8,584 -> $8,584 opening). BORROWINGS — PASS (overdraft $1,761,250 -> $0, consistent with FY24H1's mid-year disclosure of full repayment). PROVISIONS — PASS (exact tie-out, $1,728,796 -> $1,728,796 opening per Note 17). GOODWILL — PASS (unchanged $1,867,660, no impairment). DIVIDEND SUBSEQUENT EVENT — PASS (FY23's flagged $219,470 declared-but-unpaid dividend confirmed paid in FY24). NET DEBT INCL. LEASES — improved from $7,374,478 to $4,228,084 (genuine deleveraging, not a discontinuity). TOTAL FACILITY LIMIT — grew from $8m to $14.5m via two disclosed increases (explained, not a discontinuity, but composition shift flagged separately above)."
  - "CONTINUITY CHECK SUMMARY vs FY24H1 (prior structured-financials.yaml, press-release-only source): REVENUE — 1H24 $53.69M + implied 2H24 $82.62M = FY24 $136.31M; a pronounced second-half skew (61% of FY revenue in 2H) consistent with management's own commentary that 'the large contracts recently won will undoubtedly skew the results in the current financial year towards a concentration of data centre revenue' (results-announcement.pdf p.3). EBITDA — 1H24 $2.99M + implied 2H24 $6.02M = FY24 $9.01M, consistent with margin improvement into 2H as major contracts progressed/completed. NPAT — 1H24 $1.82M + implied 2H24 ~$4.80M = FY24 $6.62M, same skew. EPS — 1H24 1.66c + implied 2H24 ~4.38c = FY24 6.04c. CASH — 1H24 ~$0.90M (rounded) -> FY24 $3.37M, a further ~$2.47M build in 2H24; not a discontinuity, just the precision limitation of the 1H24 press-release-only source noted again for completeness. FACILITY — see detailed flag above; FY24H1's inferred $5m overdraft limit at Dec-23 is now CONFIRMED correct by the investor-presentation.pdf timeline chart, resolving that period's flagged uncertainty."

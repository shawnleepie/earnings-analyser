extraction_flags:
  - "No prior period structured-financials.yaml exists in archive/SKS/ to diff against for continuity checks — FY23 is the oldest period in this 6-period backfill, so this is expected, not an extraction gap. Future runs (FY24H1 onward) should reconcile opening debt/cash/provisions against the FY23 closing balances recorded here."
  - "results-announcement.pdf, appendix-4e.pdf, investor-presentation.pdf and transcript.pdf were not located for FY23 (per metadata.yaml, carried over from document-fetcher) — all figures in this file are sourced solely from financial-statements.pdf (the statutory annual report)."
  - "No segment/divisional revenue breakdown disclosed — Note 24 explicitly states SKS is regarded as a single reportable segment for FY23. companies.yaml segments: [] for SKS is correct and requires no update for this period."
  - "No gross profit / cost of sales line disclosed — P&L is presented by nature of expense (AASB 101), not by function. gross_margin_pct recorded as not_available rather than estimated from a partial expense subset."
  - "No underlying/normalised NPAT disclosed — SKS reports statutory results only for FY23, no non-IFRS earnings measure or reconciliation presented."
  - "No gearing ratio or other quantified leverage/capital-management metric disclosed by the company; net_debt figures in this file are derived by the extractor, not company-reported, and are labelled as such."
  - "No maturity date disclosed for either the CBA overdraft facility or the CBA bank guarantee facility (Note 17, Note 23(c)/(d)) — consistent with an at-call/annually-reviewed overdraft structure but not explicitly stated in the text."
  - "Interest rate risk table (Note 3(d), p.49-50) is a complex multi-column table that extracted with some column misalignment; the borrowings weighted-average rate of ~6.33% (FY23) / ~4.75% (FY22) is inferred from positional matching against known borrowings balances and cross-referenced against the qualitative statement that borrowings are floating-rate (Note 3(a)) — moderate rather than high confidence on the precise rate figure."
  - "Cash flow statement (face statement, p.36) extracted with some line-item ambiguity in a PDF-to-text pass (multi-column layout). Headline operating cash flow ($2,922,480) is high-confidence, cross-validated exactly against the clean Note 23(a) reconciliation table. Individual investing/financing line items (capex split, and a ~$179k gap in the financing subtotal) are lower confidence and flagged individually above rather than presented as precise without caveat."
  - "Material related-party item worth carrying forward to the disclosure-tone analysis (section 4 of the framework): 700 Spencer Street Pty Ltd (owned by the executive directors/senior executives) is the landlord for the Group's registered office/principal place of business and invoiced the Group $300,000 in FY23 vs $62,500 in FY22 (a ~380% increase) — Note 28(c), p.66. Directors state the transaction was 'on an arm's length basis on normal commercial terms and conditions' but the quantum of increase is material enough to track in future periods."
  - "Consensus not queried — FactSet MCP requires OAuth authentication not completed this session (see consensus section note above)."

extraction_flags:
  - "investor-presentation.pdf not located for FY25H1 (carried over from metadata.yaml, preserved here) — transcript.pdf also not located (carried over from metadata.yaml, preserved here)."
  - "SEGMENT DISCLOSURE: statutory position UNCHANGED — Note 9 (Operating Segments) confirms SKS continues to report as a single operating segment, near-identical wording to FY24 Note 22 / FY23 Note 24 (only 'IT' -> 'technology' wording drift, not substantive). companies.yaml segments: [] NOT changed this period. HOWEVER, the voluntary non-statutory data-centre-vs-traditional dollar revenue split (first disclosed in FY24's investor-presentation.pdf p.6) was NOT repeated this period in either available source document — results-announcement.pdf p.2 discusses the mix shift only qualitatively, with no dollar split. This appears to be a document-availability gap (no investor presentation was lodged this half) rather than a withdrawal of the disclosure practice, but flagged either way per project convention — should be re-checked when FY25 (annual, with presentation) is extracted."
  - "EBITDA/EBIT METHODOLOGY: the company's own disclosed EBITDA ($9.81M per results-announcement.pdf chart, tying to the disclosed 227.7%/9.1% growth rates) and EBIT ($8.46M per text) figures reconcile to a NET-of-interest-income finance-cost addback (PBT + D&A + [finance costs less interest income]), not the GROSS finance-cost addback methodology used as primary in the FY23/FY24 structured-financials.yaml files. The two methods coincided in prior periods only because interest income was immaterial then ($615-$25,289); now that interest income is $235,253 (on a $19.6M cash pile), the methods diverge by ~$235k on both EBIT and EBITDA. Recorded the company-consistent net-basis figures as primary this period and flagged the gross-basis alternative for cross-file comparability. This is a genuine definitional/QoE point, not an extraction error — worth flagging to the profitability-earnings-analyst as something to hold constant (or explicitly reconcile) across periods."
  - "TAX: reverted from FY24's one-off income tax BENEFIT ($(125,817), driven by non-recurring prior-period DTA recognition and full utilisation of carried-forward tax losses) to a near-statutory-rate income tax EXPENSE of $2,594,261 (effective rate ~31.0%) this half. This is the expected normalisation flagged as anticipated in the FY24 file — not a discontinuity, but material to QoE trend analysis (FY24's bottom line was flattered by a benefit that has now fully reversed to a normal tax charge)."
  - "DEBT/FACILITIES: total bank facility limit grew from $14.5M (FY24 close) to $21M (per results-announcement.pdf p.3), but NO sub-facility breakdown (overdraft/guarantee/equipment-lease limits, drawn amounts, maturities, interest rates, fixed/floating) is disclosed this period — the FY24 annual report's Note 21 (Financing Facilities) has no condensed-interim equivalent, and no investor-presentation.pdf (source of the facility-timeline chart in FY24) exists for FY25H1. Only the drawn bank-guarantee balance ($12,812,435, per Note 10 Contingent Liabilities) is confirmed and ties out exactly to FY24's closing guarantee balance. Net drawn borrowings remain nil (no long or short-term debt), confirmed both by the cash flow statement and results-announcement.pdf p.3 text. This facility-composition gap should be closed when the FY25 annual report (with a full financing-facilities note) is extracted."
  - "GOODWILL: not separately disclosed this half (no intangibles-breakdown note in the condensed interim report, unlike the FY24/FY23 annual reports). Recorded as INFERRED unchanged at $1,867,660 based on (a) no acquisition activity (confirmed via Note 11 Subsequent Events and absence of any acquisition cash flow) and (b) the small $26,190 increase in total intangibles being consistent with capitalised software rather than goodwill. Flagged as an inference requiring confirmation against the FY25 annual report, not a directly-sourced figure."
  - "IMPAIRMENT: no impairment charge or impairment-testing note disclosed this half (condensed interim reports do not require one absent a trigger event, and none is indicated) — recorded as not_available rather than assumed nil, though FY24's confirmed >14x headroom makes a 1H25 impairment unlikely."
  - "DIVIDEND: two dividends must not be conflated (same recurring risk flagged in FY24H1/FY24 files): (1) $0.01/share fully franked, $1,120,699, PAID 14 Oct 2024 — this is the FY24 final dividend, already flagged as a subsequent event in the FY24 file, now confirmed paid (continuity PASS); (2) $0.01/share fully franked interim dividend DECLARED 24 Feb 2025 (record date 18 Mar 2025, payable 4 Apr 2025) — a NEW subsequent event not yet reflected in the 31 Dec 2024 balance sheet, and explicitly described by management as 'the first' interim dividend the company has ever declared — a genuine capital-management milestone, not seen in any prior period's file."
  - "No gross profit / cost-of-sales line disclosed — nature-of-expense P&L format unchanged from all prior periods. No maintenance-vs-growth capex split disclosed — unchanged flag. No formal gearing ratio disclosed — unchanged flag. No ROCE/Operating Margin % non-GAAP ratios this period (those were investor-presentation.pdf features; absent this period due to no presentation being lodged)."
  - "COST STRUCTURE (non-schema, useful for QoE/section-1 analysis): employee benefits expense rose 150% to $47,753,246 (1H24: $19,117,786), a materially FASTER rate than the 116% revenue increase — Directors' Report p.2 attributes this to 'the change in revenue mix'. Materials/consumables/logistics rose only 88% to $55,906,220 and FELL as a proportion of revenue, from 55% to 48% — also attributed to the data-centre mix shift (data centre work is more labour/less materials-intensive per dollar of revenue than traditional work, per management's own framing). Net effect: gross cost mix shifted toward labour and away from materials — worth flagging to the profitability-earnings-analyst as a genuine margin-composition change, not just a scale effect."
  - "COMPANY GUIDANCE (new this period — first explicit quantitative guidance in the backfill so far): results-announcement.pdf p.4 states the Board 'considers it reasonable to forecast full-year revenue for FY25 of $260 million on a before-tax margin in the vicinity of 7%.' This is guidance, not consensus (FactSet consensus not available per above) — flagged for the profitability-earnings-analyst's guidance-bridge analysis: 1H25 revenue $115.94M implies an ~$144.06M 2H25 requirement (a further ~24% HoH increase) to hit the $260M full-year figure, against a backdrop of $174M work-on-hand and a $570M open-tender pipeline (of which $334.8M is data-facility-related) disclosed on the same page — both non-schema but directly relevant context for assessing guidance credibility."

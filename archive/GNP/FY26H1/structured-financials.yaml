segment_structure_check: >
  CONFIRMED UNCHANGED from FY25 (annual). GNP still reports three operating segments: Infrastructure /
  Services / Energy and engineering (Note 4, p.13: "Management currently identifies the Group's three
  business lines as its operating segments: infrastructure, services, and energy & engineering"). This is
  the SAME structure introduced at FY25 annual (which itself replaced the FY23/FY24/FY25H1-vintage
  Infrastructure/Communications/Industrial Services structure via an exact $17.46m offsetting Pole
  Inspection & Nailing transfer, per archive/GNP/FY25/structured-financials.yaml). No third segment change
  has occurred this half. Cross-check: this period's HY25 (31 Dec 2024) comparator disclosed under the new
  structure — Infrastructure $176,487,104, Services $63,736,316, Energy and engineering $92,650,985 (Note 4,
  p.14) — has Energy and engineering EXACTLY equal to the old "Industrial Services" figure ($92,650,985, per
  archive/GNP/FY25H1/structured-financials.yaml), confirming continuity of the pure-relabel component, and
  Infrastructure/Services split by a $15,614,014 offsetting amount (192,101,118-176,487,104 =
  63,736,316-48,122,302 = 15,614,014) consistent with continued Pole Inspection & Nailing allocation to
  Services. IR deck (p.5) still tags segments "(Formerly Industrial Services)" / "(Formerly Communications)",
  consistent with FY25's own IR deck — not a new relabel event.
  companies.yaml's segments field remains [] (confirmed still blocked for editing this session, per instruction
  — not retried). Pending update (outstanding across SIX consecutive sessions: FY23, FY24H1, FY24, FY25H1,
  FY25, FY26H1): segments: ["Infrastructure", "Services", "Energy & Engineering"]. fiscal_year_end is
  ALREADY correctly recorded as "30 June" in companies.yaml — no change needed there.

balance_sheet_continuity_check_vs_FY25_closing:
  result: >
    MOSTLY clean, but with TWO genuine discontinuities flagged explicitly (one material and unexplained —
    inventory; one an internal document inconsistency — contract liabilities) and several smaller items that
    ARE explained by Note 21's retrospective finalisation of FY25 acquisitions' provisional purchase price
    accounting (PPA). Per instruction, flagged rather than silently accepted.
  items_explained_by_note21_ppa_finalisation:
    context: >
      Note 21 (p.27-28) discloses that during HY26H1 the Group finalised provisional accounting for the
      Commtel, Partum, GTS and Arbor West acquisitions (all within their 12-month AASB3 measurement windows),
      with retrospective adjustments per AASB3. The "Summary of changes" column gives: Goodwill +6,132,090;
      Cash (43,042); Other current assets (1,415,056); Current liabilities (3,307,327) [i.e. liabilities up];
      Fixed assets (4,063); Non-current liabilities (1,394,378) [liabilities up]; Consideration (31,776).
      "The final accounting adjustments... had no impact on the profit or loss for the year ended 30 June
      2025 or half-year ended 31 December 2025" — i.e. balance-sheet-only, retrospectively restating the
      30 June 2025 comparative shown in THIS half's financial statements.
    items:
      - {item: "Cash (cash equiv + restricted, excl. new term deposit)", fy25_closing_per_fy25_file: 160819159, fy26h1_opening_comparative: 160776117, diff: -43042, explained: true, note: "Diff of $43,042 ties EXACTLY to Note 21's 'Cash' summary-of-changes adjustment."}
      - {item: "Goodwill", fy25_closing_per_fy25_file: 57782819, fy26h1_opening_comparative: 63914908, diff: 6132089, explained: true, note: "Diff ties almost exactly ($1 rounding) to Note 21's 'Goodwill' summary-of-changes adjustment of +6,132,090."}
      - {item: "Intangible assets total", fy25_closing_per_fy25_file: 71981712, fy26h1_opening_comparative: 78113798, diff: 6132086, explained: true, note: "Consistent with the goodwill restatement above (customer contracts/IP unchanged)."}
      - {item: "Provisions, current (Provision for earn out)", fy25_closing_per_fy25_file: 11302840, fy26h1_opening_comparative: 11271064, diff: -31776, explained: true, note: "Ties exactly to Note 21's 'Consideration transferred/transferrable' summary-of-changes adjustment of -31,776."}
  items_NOT_explained_flagged_for_investigation:
    - item: "Inventory"
      fy25_closing_per_fy25_file: 5712374
      fy26h1_opening_comparative: 3292292
      diff: -2420082
      diff_pct: -42.4
      severity: MATERIAL, UNEXPLAINED
      note: >
        A $2,420,082 (42.4%) reduction to the 30 June 2025 comparative inventory balance, with NO
        corresponding line in Note 21's summary-of-changes table (which covers Goodwill, Cash, WIP, Other
        current assets, Non-current assets, Current/Non-current liabilities, Fixed assets, Intangible assets
        — WIP itself shows a summary-of-changes of $0, ruling out that as the explanation). Not resolved from
        the text available. Flagged explicitly per instruction rather than silently accepted — could indicate
        a reclassification (e.g. into "Other current assets" or WIP within contract assets) not narrated, or
        a genuine restatement/extraction discrepancy. Recommend the balance-sheet-cashflow-analyst probe this
        at FY26 annual reporting.
    - item: "Contract liabilities"
      severity: MATERIAL, INTERNAL DOCUMENT INCONSISTENCY plus discontinuity
      sofp_face_30jun25_comparator: 103061535
      note14_30jun25_comparator: 99075816
      fy25_closing_per_fy25_file: 99075816
      note: >
        GENUINE internal inconsistency WITHIN this half's own financial statements: the Statement of
        Financial Position face (p.9) shows Contract liabilities of $103,061,535 for the 30 June 2025
        comparative column, but Note 14 (p.23, the note the SOFP itself cross-references) shows $99,075,816
        for the IDENTICAL date — a $3,985,719 gap between face and note in the same document. The Note 14
        figure ($99,075,816) matches FY25's own reported closing balance exactly (archive/GNP/FY25/
        structured-financials.yaml), while the SOFP face figure does not. Verified which one is "load-bearing"
        for the balance sheet: summing all 30 June 2025 current liabilities using the SOFP face figure of
        $103,061,535 reconciles EXACTLY to the disclosed Total current liabilities of $266,929,617; using
        Note 14's $99,075,816 instead would be $3,985,719 short. This means the SOFP face — not Note 14 — is
        the balance actually used to build the reported total, i.e. Note 14 itself contains the error (or a
        stale, unrestated figure), and the TRUE 30 June 2025 contract liabilities balance differs from what
        FY25's own annual report disclosed by ~$4.0m. Not explained by Note 21's PPA finalisation table
        (which does not list contract liabilities). Flagged for the balance-sheet-cashflow-analyst and
        disclosure-tone-analyst — a genuine disclosure-quality issue, not merely rounding.
  items_small_and_likely_reclassification_not_flagged_as_material:
    - {item: "Total trade and other receivables", fy25_closing_per_fy25_file: 75877196, fy26h1_opening_comparative: 76882220, diff: 1005024, note: "1.3% gap, immaterial; not traced to a specific cause."}
    - {item: "Total trade and other payables", fy25_closing_per_fy25_file: 106699176, fy26h1_opening_comparative: 106179796, diff: -519380, note: "0.5% gap — plausibly explained by 'Employee benefits' now appearing as its own standalone current SOFP line ($20,968,467 at 30 Jun 25) this half, whereas FY25's own payables figure explicitly included accrued wages within trade and other payables per that file's own note; not independently confirmed."}
    - {item: "Lease liabilities, total", fy25_closing_per_fy25_file: 41671074, fy26h1_opening_comparative: 41672282, diff: 1208, note: "Immaterial rounding."}
  net_debt_continuity: {fy25_closing_net_cash_company_basis: 113500000, fy26h1_opening_comparative_net_cash_company_basis: 113400000, note: "IR deck p.9 shows Jun-25 Net Cash of $113.4m vs FY25's own file's $113.5m — $0.1m immaterial rounding, not flagged further."}
  conclusion: >
    Two genuine discontinuities require follow-up (inventory, unexplained; contract liabilities, an internal
    face-vs-note inconsistency within this half's own document, with the note appearing to carry the error).
    Several other small variances are explained cleanly by Note 21's retrospective PPA finalisation for the
    FY25 acquisitions (goodwill +$6.13m, cash -$43k, provisions -$32k) — a good disclosure of a genuine
    restatement, not silently absorbed.


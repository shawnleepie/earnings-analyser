  - "MATERIAL, UNEXPLAINED: 30 June 2025 comparative inventory shown in this half's own balance sheet ($3,292,292) differs from FY25's own reported closing inventory (archive/GNP/FY25/structured-financials.yaml: $5,712,374) by $2,420,082 (42.4%), with no corresponding item in Note 21's PPA-finalisation summary-of-changes table. Genuinely unresolved from the text available — flagged for the balance-sheet-cashflow-analyst to probe at FY26 annual. See balance_sheet_continuity_check_vs_FY25_closing."
  - "MATERIAL, INTERNAL DOCUMENT INCONSISTENCY: this half's own Statement of Financial Position (p.9) and Note 14 (p.23) disagree on the 30 June 2025 comparative Contract liabilities balance by $3,985,719 ($103,061,535 face vs $99,075,816 note) — the SOFP face figure is the one that ties to the disclosed Total current liabilities and therefore appears to be the 'true' balance, meaning Note 14 (which matches FY25's own originally reported figure) itself contains a stale or erroneous comparative. A genuine disclosure-quality issue in the audited-equivalent (reviewed) interim report, not mere rounding. See balance_sheet_continuity_check_vs_FY25_closing."
  - "EXPLAINED restatement: FY25's closing goodwill/intangibles were retrospectively increased by $6,132,089/$6,132,086 respectively (from $57,782,819/$71,981,712 to $63,914,908/$78,113,798) due to Note 21's finalisation of provisional purchase price accounting for the Commtel, Partum, GTS and Arbor West acquisitions during this half — explicitly disclosed as having 'no impact on the profit or loss for the year ended 30 June 2025 or half-year ended 31 December 2025.' Smaller explained items: cash -$43,042 and current provisions -$31,776, both tying exactly to Note 21's own summary-of-changes table."
  - "STRUCTURAL CHANGE: GNP declared its first-ever interim dividend this half (2.0 cents/share, fully franked, ~$3.6m, explicitly labelled 'maiden' by the company) — every prior period in this archive paid nil interim dividend. A genuine capital-allocation policy shift for the profitability-earnings-analyst to note, not merely a one-off declaration. Declared 20 Feb 2026 (post-balance-date), unpaid as at 31 Dec 2025."
  - "NEW MAJOR FINANCING EVENT, LIMITED DETAIL: a $429m revolving syndicated facility agreement was executed during the half (per IR deck 'Corporate Matters') but no facility-level detail (drawn amount, maturity, margin, fixed/floating) is disclosed in any of the three documents reviewed. Flagged for follow-up at FY26 annual reporting, which should include the full annual-only facilities note (equivalent to FY25's Note 26)."
  - "NEW: bank guarantee/surety bond facility pool expanded materially this half — combined limit up from $260m (30 Jun 25) to $515m (31 Dec 25), including two brand-new facilities (NAB $65m, HSBC $100m) alongside CBA (limit REDUCED to $65m from $120m) and Surety bonds (limit increased to $285m from $140m). Combined utilisation $236.4m, headroom $278.6m. See balance_sheet.total_debt_by_facility."
  - "Segment structure CONFIRMED UNCHANGED this half (Infrastructure/Services/Energy and engineering, same as FY25 annual) — no third segment reallocation event. Energy and engineering (formerly Industrial Services) again shows a segment that is DOWN half-on-half (-5.75% revenue, -22.5% profit vs H2FY25 derived) despite being up strongly year-on-year (+33.7% revenue) — the same recurring HoH-vs-YoY divergence pattern flagged for this segment's predecessor in FY25H1's extraction, now observed for a second consecutive comparable period. Suggests H2 is structurally the stronger half for this segment (BESS/EPC project billing skew) rather than H1FY26 representing weakness in isolation."
  - "GENUINE IMPROVEMENT, CONTINUED: both the Normalised EBITDA bridge (statutory EBITDA + disclosed pretax normalisations = disclosed Normalised EBITDA, exactly) and the Appendix 4D Normalised Profit bridge (statutory NPAT + acquisition costs - ECM net gain = disclosed Normalised Profit, exactly) reconcile CLEANLY this half — continuing the disclosure-quality improvement first observed at FY25 annual, in contrast to the unresolved $160,746-$160,747 (EBITDA) and $409,621 (NPAT) gaps flagged in FY24H1 and FY25H1."
  - "UNRESOLVED, GROWING: the unidentified 'Other losses' P&L line (below Operating profit) has now appeared in every half since HY25 with no standalone note ever breaking it down — $160,747 (HY25), effectively ~$(30,799) in H2FY25 (implied), now $564,392 this half (HY26), its largest value yet. The one previously-available partial data point (Volt Group Ltd/VPR FVTPL investment) is now RULED OUT as this half's driver, since its carrying value is unchanged at $645,400 both this half and at 30 June 2025."
  - "Net finance position swung back to a net EXPENSE ($82,758) this half from the net INCOME of $660,589 recorded in HY25 — exactly the reversal anticipated in archive/GNP/FY25H1/structured-financials.yaml's own flag (that the HY25 finance-income tailwind was 'unlikely to repeat at the same scale' as cash was deployed into acquisitions/capex). Finance costs rose 136% YoY, consistent with the much larger lease liability base; finance income rose only 45% despite a far larger average cash balance, which is not separately explained in the text available."
  - "Net cash (company-reported basis) grew only $13.5m half-on-half despite a record $73.7m of net operating cash flow — the gap is explained by $34.4m capex, $22.5m placed in a new restricted term deposit (a new asset class this half, for JV cash management), $6.5m dividend paid (relating to FY25 earnings), and a near-50% increase in lease principal repayments. See balance_sheet.net_debt.company_reported_net_cash.flag."
  - "GNP's own 'Free Cash Flow' / cash-conversion disclosure basis remains, for a SIXTH consecutive comparable period, NOT capex-deducted despite the label (199% 'FCF to EBITDA conversion' this half is pre-tax operating CF ÷ normalised EBITDA with zero capex deduction, confirmed reconciling exactly to the company's own $91.9m figure). The project's own capex-deducted FCF methodology gives $60.6m (~130.9% of statutory EBITDA) as the comparable like-for-like figure. See cash_flow.company_disclosed_free_cash_flow_flag."
  - "No growth vs maintenance capex split disclosed (same recurring gap as every prior GNP period). Capex-to-cash-flow reconciliation ties well this half (~0.3%/$117k gap vs the Directors' Report's $34.4m headline), continuing the improved reconciliation quality seen since FY25H1."
  - "New disclosure discrepancy: a third joint arrangement (Acciona Genus/Western Renewables Link, 25% interest, $1.6B project) is referenced in the Appendix 4D cover and IR deck 'Key Project Awards' slide but is NOT included in Note 7's detailed joint-arrangements financial disclosure (which still lists only 2 arrangements). Likely a timing/materiality issue (recent award) rather than an omission error, but flagged for the disclosure-tone-analyst to monitor at FY26 annual."
  - "Chart-labelling inconsistency (not resolved): this half's IR deck 'Orderbook & Pipeline' chart shows FY2025 orderbook/pipeline figures ($1,985m orderbook / $2,409m tender pipeline) that are materially HIGHER than the $519m orderbook / $2,003m tender pipeline shown for 'FY2025' in archive/GNP/FY25/structured-financials.yaml's own chart extraction from FY25's own IR deck. The FY24 data point is stable across both decks ($519m), so this is specifically a FY25-column relabelling/restatement between the two presentations, not a broader pattern — flagged rather than resolved."
  - "Directors' Report narrative flag (not necessarily an error, but worth cross-checking against strategy): West Coast/WA revenue grew 65% YoY this half vs East Coast's 22%, and East Coast's share of group revenue fell from 42% (FY25 full year) to 36% (H1FY26) — apparently in tension with the company's repeated stated strategic focus on 'growing in the east coast market.' See guidance_and_outlook.east_coast_west_coast_growth_flag."
  - "FY26 EBITDA growth guidance of 'circa 35%' (re-iterated this half) is an UPGRADE from the 20-25% range given at FY25 annual reporting (Aug 2025) — the upgrade itself was announced 22 January 2026, pre-dating this half's release, so this result reiterates rather than raises an already-upgraded guide. Continues GNP's established pattern of guiding conservatively then beating/upgrading in-year."
  - "Minor ($182) rounding discrepancy between the FY25 final dividend as recorded in the Statement of Changes in Equity ($6,514,917, Note 18) and the Statement of Cash Flows ('Dividends paid' $6,515,099) — immaterial, flagged for completeness only."
  - "Minor (~$0.2m) discrepancy between this file's derived statutory EBITDA for the HY25 comparator ($26,308,587, matching archive/GNP/FY25H1/structured-financials.yaml exactly) and results-announcement.pdf's own summary table figure of $26.1m for the same period/measure — likely a rounding/definitional artefact in the release's own comparative table rather than a substantive issue; both documents carry explicit rounding caveats."
  - "Balance-sheet continuity vs FY25's closing (30 June 2025) position is MOSTLY clean, with several items EXPLAINED by Note 21's retrospective PPA finalisation (goodwill, cash, provisions) but two genuine discontinuities requiring follow-up (inventory, unexplained; contract liabilities, an internal face-vs-note inconsistency) — see balance_sheet_continuity_check_vs_FY25_closing for full detail, per instruction to flag rather than silently accept."

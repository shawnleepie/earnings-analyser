extraction_flags:
  - "FactSet MCP not accessible this session (authentication required, not completed) — all consensus fields recorded as not_available rather than sourced from web search or broker notes, per project guardrails."
  - "config/companies.yaml write BLOCKED this session (permission not granted) when attempting to update the GNP entry's segments field from [] to [\"Infrastructure\", \"Communications\", \"Industrial Services\"] and add a confirming note. This has now been flagged across TWO extraction sessions (FY23 and FY24H1) without the underlying config being updated — segments ARE confirmed stable and unchanged (financial-statements.pdf p.12, Note 4: 'no changes from the previous reporting period ended 30 June 2023 in the measurement methods used to determine operating segments'). Recommend a session with write permission to config/companies.yaml apply this pending edit."
  - "GenusPlus's P&L remains presented 'by nature' with no cost-of-sales/gross-profit subtotal — gross_margin_pct genuinely not disclosed, consistent with FY23."
  - "Recurring quality-of-earnings issue (also flagged in FY23): GenusPlus discloses at least FOUR different 'normalised/adjusted' NPAT figures this half across its own documents (statutory $9.05m; Appendix 4D 'Normalised Profit' $9.57m; IR-deck 'NPAT-A' $10.2m; IR-deck 'Normalised NPAT-A' $10.7m), plus two non-interchangeable 'EBIT' concepts ($15.08m statutory Operating profit vs ~$13.5m IR-deck EBIT, differing by the $1.53m Blue Tongue JV impairment). See pnl.npat_underlying and pnl.ebit_alt_per_investor_presentation for full detail."
  - "Cash-conversion methodology changed between FY23 (post-tax operating CF ÷ statutory EBITDA = 116%) and HY24 (pre-tax operating CF ÷ normalised EBITDA = 125%) without being flagged by the company — the two headline percentages are not directly comparable. See cash_flow.cash_conversion."
  - "Internal $4.2m inconsistency between the Directors' Report's stated '$4.4m of capex acquired under finance contract agreements' and Note 11's own right-of-use asset addition table ($8.6m total ROU additions for the half) — not reconciled anywhere in the document. See cash_flow.total_capex_disclosed.note."
  - "No growth vs maintenance capex split disclosed (same gap as FY23)."
  - "Reduced disclosure granularity vs the FY23 annual report, as expected for an AASB134 interim report: no capital-management/gearing-ratio note (FY23 annual Note 41 equivalent), no CGU-level goodwill breakdown (FY23 annual Note 24 equivalent), no per-facility bank debt itemisation (FY23 annual Note 27 equivalent — this half only discloses aggregate bank borrowings, not the CBA/Toyota/ANZ/Westpac/Mercedes-Benz equipment finance breakdown), no separate provisions note (FY23 annual Note 29 equivalent), and trade receivables shown net-of-ECL only (not gross+net as FY23 annual Note 16 showed). None of these are extraction failures — they reflect AASB134's reduced interim disclosure requirements — but they mean several FY23 data points (e.g. per-facility debt maturity/margin, CGU goodwill allocation) cannot be refreshed this half and analysts should refer back to the FY23 file (and forward to the FY24 annual report) for that detail."
  - "The IR deck's 'Net Cash' bridge (investor-presentation.pdf p.15) continues the SAME unresolved lease-liability reconciliation issue flagged in the FY23 extraction — two separate lease-liability sub-lines shown in the presentation ($19.1m 'Lease liabilities' + $6.7m 'ROU lease liabilities') do not exactly tie to the statutory total lease liabilities of $25,773,231. Recorded as-is per document; a genuine recurring internal disclosure inconsistency rather than an extraction error."
  - "Investor-presentation.pdf's 'company_reported_total_debt' of $24.7m (p.25, as at 20 Feb 2024, i.e. a later date than the 31 Dec 2023 balance-sheet date) is not independently reconciled to the statutory bank-borrowings + lease-liability figures — recorded as-is with the caveat that it may reflect a subsequent-events date and/or a different debt definition."
  - "Investor-presentation.pdf segment revenue figures (Infrastructure ~$162m, Industrial Services ~$58m, Communications ~$34m) are GROSS of inter-segment revenue, whereas the statutory Note 4 external-revenue figures used as primary in this file ($158.8m / $57.5m / $33.7m) are net of inter-segment and reconcile exactly to total Group revenue — same non-comparable-basis pattern flagged in FY23."
  - "No results-announcement.pdf or transcript.pdf located for FY24H1 (already flagged by document-fetcher in metadata.yaml) — commentary/tone extraction for this period relies on the Directors' Report (within financial-statements.pdf) and investor-presentation.pdf only."
  - "Balance-sheet continuity vs FY23's closing (30 June 2023) position is CONFIRMED clean across every major line item checked (cash, receivables, contract assets/liabilities, inventory, goodwill, intangibles, bank debt, lease liabilities, total equity, and the company's own non-IFRS net-cash metric) — see balance_sheet_continuity_check_vs_FY23_closing above for full detail, including one apparent-but-resolved $50,000 payables/provisions presentation nuance."

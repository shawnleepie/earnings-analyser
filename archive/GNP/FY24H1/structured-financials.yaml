  npat_underlying:
    value: not_a_single_figure
    source: null
    note: >
      Same quality-of-earnings pattern as FY23 recurs this half: GenusPlus discloses at least FOUR distinct
      "normalised/adjusted" NPAT figures across its own HY24 documents, each excluding a different combination
      of items. Recorded as variants below rather than picking one as "the" underlying figure — feeds directly
      into profitability-earnings-analyst QoE work.
    variants:
      appendix_4d_normalised_profit:
        value: 9574172
        source: "financial-statements.pdf p.1 (Appendix 4D cover, 'Normalised Profit from ordinary activities after tax'), up 45.24% on pcp"
        reconciling_items_after_tax:
          - "Restructure costs $555,482 (HY23: $958,300)"
          - "Acquisition costs (incl. Blue Tongue Energy FV adjustment) $1,117,220 (HY23: $803,600)"
          - "Net proceeds/(costs) from ECM claim $(1,147,995) (HY23: $41,554)"
          - "Tax expense HY24 adjustment $NIL (HY23: $(1,579,095))"
      investor_presentation_npat_a:
        value: 10200000
        source: "investor-presentation.pdf p.10 and p.26 Appendix — 'NPAT-A' = statutory NPAT + amortisation of acquisition intangibles ONLY ($1.1m), a narrower normalisation than the Appendix 4D variant above (does NOT add back restructuring/acquisition/ECM items)"
        pcp_hy23: 7500000
        change_pct: 35.2
      investor_presentation_normalised_npat_a:
        value: 10700000
        source: "investor-presentation.pdf p.26 (Appendix reconciliation) — 'Normalised NPAT-A' = NPAT-A ($10.2m) + acquisition costs $0.0m + BTE FV adjustment $1.1m + restructure costs $0.6m - ECM claim gain $1.1m ≈ $10.7m; i.e. NPAT-A PLUS the same non-recurring items used in the Appendix 4D variant, giving the broadest of the four figures"
        pcp_hy23: 7800000
        reconciles_to_appendix_4d_variant: "Normalised NPAT-A ($10.7m) minus acquisition-intangible amortisation addback (~$1.1m) ≈ Appendix 4D's Normalised Profit ($9.57m) — consistent methodology, just a different bundling of addbacks"
    flag: "Recurring disclosure-quality observation (also flagged in FY23): GenusPlus does not converge on a single 'underlying NPAT' definition period to period. The profitability-earnings-analyst should treat the Appendix 4D 'Normalised Profit' figure as the primary regulatory disclosure (it is the one headlined in the ASX Appendix 4D 'Results for announcement to the market' table) and treat the IR-deck NPAT-A/Normalised NPAT-A variants as supplementary."

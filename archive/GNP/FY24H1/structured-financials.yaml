prior_period_comparison_basis: >
  This is an interim (half-year) period. PCP comparison below uses the 31 Dec 2022 (HY23) comparatives
  embedded directly within the FY24H1 statutory accounts (same document), per project convention — NOT
  the FY23 full-year (30 June 2023) figures. Balance-sheet CONTINUITY is separately checked against
  archive/GNP/FY23/structured-financials.yaml's closing (30 June 2023) position, since the FY24H1 balance
  sheet's own comparative column is 30 June 2023. HoH (half-on-half, vs H2 FY23 = Jan-Jun 2023) figures are
  derived below as FY23 full year minus HY23, since H2FY23 has no standalone archived period of its own.

balance_sheet_continuity_check_vs_FY23_closing:
  result: "CONFIRMED — no discontinuity. Every FY24H1 balance-sheet line's own 30 June 2023 comparative column
    ties EXACTLY to archive/GNP/FY23/structured-financials.yaml's closing (30 June 2023) figures."
  items_checked:
    - {item: "Cash", fy23_closing: 46737238, fy24h1_opening_comparative: 46737238, match: true}
    - {item: "Total trade and other receivables", fy23_closing: 56948784, fy24h1_opening_comparative: 56948784, match: true}
    - {item: "Contract assets", fy23_closing: 37595573, fy24h1_opening_comparative: 37595573, match: true}
    - {item: "Inventory", fy23_closing: 3796472, fy24h1_opening_comparative: 3796472, match: true}
    - {item: "Contract liabilities", fy23_closing: 16876882, fy24h1_opening_comparative: 16876882, match: true}
    - {item: "Intangible assets total", fy23_closing: 31063401, fy24h1_opening_comparative: 31063401, match: true}
    - {item: "Goodwill", fy23_closing: 19614788, fy24h1_opening_comparative: 19614788, match: true}
    - {item: "Bank borrowings current", fy23_closing: 1580000, fy24h1_opening_comparative: 1580000, match: true}
    - {item: "Bank borrowings non-current", fy23_closing: 4280000, fy24h1_opening_comparative: 4280000, match: true}
    - {item: "Lease liabilities current", fy23_closing: 9007690, fy24h1_opening_comparative: 9007690, match: true}
    - {item: "Lease liabilities non-current", fy23_closing: 12861963, fy24h1_opening_comparative: 12861963, match: true}
    - {item: "Total equity", fy23_closing: 104976133, fy24h1_opening_comparative: 104976133, match: true}
    - {item: "Company-reported net cash (IR deck non-IFRS metric)", fy23_closing: 22400000, fy24h1_opening_comparative: 22400000, match: true}
  one_apparent_but_resolved_discrepancy: >
    FY24H1's own document contains TWO different 30-Jun-2023 comparatives for "trade and other payables":
    the face of the balance sheet (p.8) shows $51,043,122, while Note 9 Financial assets and liabilities
    (p.17, amortised-cost table) shows $50,993,122 for the identical date — a $50,000 internal difference.
    This reconciles exactly to the $50,000 "provisions" balance disclosed separately in FY23's Note 29
    (expected losses/writedowns) — i.e. Note 9 in this interim report captures only financial-instrument
    payables at amortised cost (excluding the non-financial $50k provision), while the balance-sheet face
    figure appears to bundle the provision into "trade and other payables". Net conclusion: NOT a genuine
    discontinuity, just a disclosure-presentation nuance — flagged for awareness rather than as an error.


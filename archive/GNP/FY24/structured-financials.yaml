extraction_flags:
  - "FactSet MCP not accessible this session (authentication required, not completed) — confirmed unavailable for a third consecutive GNP extraction (FY23, FY24H1, FY24). All consensus fields recorded as not_available rather than sourced from web search or broker notes, per project guardrails."
  - "config/companies.yaml is permission-blocked for editing in this session (confirmed blocked across prior sessions too) — did NOT retry the edit per instruction. The pending update remains: segments: [\"Infrastructure\", \"Communications\", \"Industrial Services\"] (unchanged and stable across FY23, FY24H1 and FY24 — 'no changes... in the measurement methods used to determine operating segments' reconfirmed each period), plus a note that the underlying goodwill CGU structure was realigned to match these segments effective 30 June 2024 (previously six legacy entity-based CGUs)."
  - "NEW this period: the statutory Note 5 segment-reporting 'Revenues' (external) row no longer sums exactly to Group statutory revenue — Infrastructure $328,946,580 + Communications $71,173,341 + Industrial Services $151,565,562 = $551,685,483, a $495,870 gap vs the P&L's $551,189,613. This is a genuine change from FY23, where the equivalent row tied exactly. Not resolved from the available disclosure; primary revenue_by_segment figures above use the statutory Note 5 external basis as in prior periods, with this gap flagged rather than silently absorbed."
  - "GenusPlus's P&L remains presented 'by nature' with no cost-of-sales/gross-profit subtotal — gross_margin_pct genuinely not disclosed, consistent with FY23/FY24H1."
  - "Recurring quality-of-earnings issue (also flagged FY23 and FY24H1): THREE distinct 'underlying/normalised NPAT' figures disclosed for FY24 (Appendix 4E excl. significant items $20.49m; Directors' Report 'NPAT-A' $21.55m; IR-deck 'Normalised NPAT-A' $22.8m, again reusing the 'NPAT-A' label ambiguously). See pnl.npat_underlying for full detail and the ~$2.3m amortisation-addback bridge between the two 'excl. non-recurring items' variants."
  - "Company's investor-presentation 'Free Cash Flow' of $93.5m (claimed '208% EBITDA conversion') is actually PRE-TAX operating cash flow (tax paid of $10.6m added back to net operating CF) and does NOT deduct any capital expenditure — a materially misleading label relative to conventional FCF usage. See cash_flow.company_disclosed_free_cash_flow_flag. The project's own capex-deducted FCF methodology gives $68.9m (~153% of statutory EBITDA)."
  - "Cash-conversion disclosure basis has now changed for a third consecutive period (FY23: post-tax CF/statutory EBITDA=116%; HY24: pre-tax CF/normalised EBITDA=125%; FY24: pre-tax CF/statutory EBITDA=208%, re-labelled 'FCF conversion') — none directly comparable. See cash_flow.cash_conversion.flag."
  - "No growth vs maintenance capex split disclosed (same gap as FY23/FY24H1). Additionally, the IR deck's headline '$17.5m net capex ($9.5m debt funded)' figure (slide 18) does not cleanly reconcile to the financial statements' own capex lines (cash PP&E purchases $13.93m; non-cash ROU additions ~$9.6m; disposal proceeds $1.35m) under any combination attempted."
  - "The Mercedes Benz Finance equipment facility (FY23: $2m limit, fully undrawn) is not mentioned anywhere in FY24's Note 27 — dropped from disclosure with no explanation. Facility limits DID increase this year for Toyota Asset Finance ($12m -> $20m) and for the CBA/Surety bond/bank-guarantee contingent facilities."
  - "Balance-sheet 'Provisions' line ($65,754 current / $650,000 non-current) carries no note cross-reference this year, and no standalone Provisions note exists (FY23's Note 29 number is reused for 'Share capital'). The new $650,000 non-current Provisions balance coincidentally equals a '$650,000 non-current contingent consideration (FVTPL)' shown separately in Note 18's financial-instruments categorisation table, but Note 27's own narrative only describes $350,000 of outstanding Blue Tongue Energy contingent consideration — unable to confirm whether these are the same item mislabelled across notes, or genuinely separate balances that happen to share a figure. See balance_sheet.provisions.note."
  - "Note 40 Capital management's own inputs (Total equity $121,236,426; Financial liabilities/Borrowings $22,780,798) do not reconcile to the face of the balance sheet (Total equity $121,166,442, a $69,984 gap) or to any combination of the balance sheet's Financial liabilities ($4,280,000) and Lease liabilities ($24,972,925) lines. This is the same category of internal inconsistency flagged in FY23's equivalent Note 41 (and, differently, in FY24H1's lease-liability reconciliation) — recorded the company's own figures as-is."
  - "Note 36 (Acquisitions) states the $1.5m Blue Tongue Energy step-acquisition impairment was 'recognised in the operating result', but the P&L structure (p.23) and Note 32 cash-flow reconciliation show it sits within 'Other (losses) and gains' BELOW Operating profit/EBIT — an apparent characterisation error in the note's wording, though the dollar figures themselves are internally consistent and match FY24H1's original disclosure of the same item (recognised entirely in H1; no incremental H2 impairment)."
  - "Goodwill CGU allocation was structurally realigned this year to match the three operating segments (replacing six legacy entity-based CGUs) — a disclosure-structure change, not an operating-segment change. Flagged for the disclosure-tone-analyst per section 4 of the analysis framework."
  - "results-announcement.pdf's 'Recurring revenue forecast to be $251 million' headline (p.1) is labelled as relating to 'FY2024' in one place in the body text (p.2: 'forecast to be $251 million in FY2024') but is unambiguously the FY2025 forecast per the Outlook section context and the identical figure in investor-presentation.pdf slide 5 (explicitly 'FY2025F') — treated here as an FY25 forecast, likely a typo in the ASX release rather than a substantive discrepancy."
  - "No results-announcement.pdf/transcript.pdf equivalent gap issue this period — a genuine separate results-announcement.pdf WAS located and used (unlike FY23 and FY24H1, where none existed). transcript.pdf still not located for FY24."
  - "Balance-sheet continuity vs FY23's closing (30 June 2023) position is CONFIRMED clean across every line item checked, including the resolution of FY24H1's flagged $50,000 trade-payables presentation nuance (FY24's own comparative column now shows the single reconciled $50,993,122 figure). See balance_sheet_continuity_check_vs_FY23_closing above."
  - "Auditor's Key Audit Matters changed composition this year: FY24 = Revenue Recognition (new) + Goodwill impairment; FY23 = Goodwill impairment only (per FY23 file's extraction_flags). The addition of a Revenue Recognition KAM reflects the growth in fixed-price, percentage-of-completion construction revenue ($236m) rather than a control weakness — noted for context."

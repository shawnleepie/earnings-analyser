          - "Restructuring costs totalling $0.8 million"
          - "Fair Value adjustments of investments $0.9 million"
          - "Does NOT add back amortisation of acquisition intangibles"
      directors_report_npat_a:
        value: 21545583
        source: "financial-statements.pdf p.6 (Directors' Report table, 'NPAT-A'), up 36.9% on PCP; also headlined in results-announcement.pdf p.1 and investor-presentation.pdf slide 12"
        reconciling_items:
          - "Amortisation of acquisition intangibles (Tandem — Communications segment, and Pole Foundations Australia — Infrastructure segment) $3,262,211 pretax, added back net of tax at 30% -> +$2,283,548 (19,262,038 + 2,283,545 ≈ 21,545,583)"
          - "Does NOT add back the acquisition/restructuring/ECM/FV-adjustment items used in the Appendix 4E variant above"
      investor_presentation_normalised_npat_a:
        value: 22800000
        source: "investor-presentation.pdf slide 29 (Appendix — Reconciliation of Non-IFRS Financial Information), 'Normalised Net profit after tax (NPAT-A)' row — same ambiguous 'NPAT-A' label reused for a different, larger figure than the financial-statements variant above (same pattern flagged in FY23 and FY24H1)"
        reconciling_items:
          - "Starts from NPAT-A ($21.5m, amortisation addback already applied)"
          - "+ Acquisition costs $0.2m"
          - "+ Restructure costs $0.8m"
          - "− ECM net claim income $0.6m"
          - "+ FV losses on investments/financial assets $0.9m"
          - "+ Tax expense prior year adjustment $0.0m (nil this year, vs $(1.6)m in FY23)"
          - "= Normalised NPAT-A ≈ $22.8m"
        note: "The ~$2.3m gap between this figure and the Appendix 4E 'excl. significant items' variant ($20.49m) is essentially the amortisation-of-acquisition-intangibles addback — i.e. the two variants that both purport to exclude 'non-recurring/significant items' differ mainly by whether amortisation is also added back."
    flag: "Consistent with prior periods, the Appendix 4D/4E 'excluding significant items' figure is the primary ASX regulatory disclosure; the Directors' Report/IR-deck 'NPAT-A' and 'Normalised NPAT-A' variants are supplementary and use a different, overlapping set of adjustments each period."

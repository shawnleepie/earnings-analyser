    - {item: "Intangible assets total", fy24_closing: 30960959, fy25_opening_comparative: 30960959, match: true}
    - {item: "Goodwill", fy24_closing: 22774555, fy25_opening_comparative: 22774555, match: true}
    - {item: "Bank borrowings current", fy24_closing: 1580000, fy25_opening_comparative: 1580000, match: true}
    - {item: "Bank borrowings non-current", fy24_closing: 2700000, fy25_opening_comparative: 2700000, match: true}
    - {item: "Lease liabilities current", fy24_closing: 10317098, fy25_opening_comparative: 10317098, match: true}
    - {item: "Lease liabilities non-current", fy24_closing: 14655827, fy25_opening_comparative: 14655827, match: true}
    - {item: "Provisions current ('Other provisions' per Note 28 rollforward)", fy24_closing: 65754, fy25_opening_comparative: 65754, match: true,
       note: "FY25H1's own interim balance sheet had shown this current 'Provisions' line spiking 11x to $744,533 at 31 Dec 2024 with no explanation (flagged as unresolved in that file). FY25's ANNUAL Note 28 rollforward begins its FY25 year from the FY24 CLOSING $65,754 figure (not from the interim $744,533), and the only addition during FY25 was via business combinations into the SEPARATE 'Provision for earn out' line. This means the H1 spike must have reversed by year-end — but no note or narrative in either the interim or annual report explains what it was or why it reversed. Flagged as resolved-in-outcome but still unexplained-in-substance."}
    - {item: "Provisions non-current ('Provision for earn out' per Note 28)", fy24_closing: 650000, fy25_opening_comparative: 650000, match: true,
       note: "FY25H1's interim balance sheet had relabelled this balance 'Other loans'; FY25's annual report reverts to the 'Provisions' / 'Provision for earn out' label used in FY24's own annual report — a presentation reversion, not a new discontinuity. This label is now explicitly tied out to Note 17's contingent-consideration FVTPL balances (see balance_sheet.provisions below), resolving the ambiguity flagged in FY24 and FY25H1."}
    - {item: "Trade and other payables (balance sheet face)", fy24_closing: 75097353, fy25_opening_comparative: 75097353, match: true}
    - {item: "Total equity (pre-adjustment)", fy24_closing: 121166442, fy25_opening_comparative: 121166442, match: true, note: "See restatement_flag below for the subsequent opening retained-earnings adjustment applied to this balance"}

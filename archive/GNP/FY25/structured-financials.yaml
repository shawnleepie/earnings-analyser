    - {item: "Net tangible assets per security, 31 Dec 2024 (cross-check vs FY25H1's own Appendix 4D figure — no separate BS comparative column exists in the annual report, but the Appendix 4E cover DOES restate this NTA figure)", fy25h1_file_value: 0.50, fy25_appendix_4e_value: 0.50, match: true}

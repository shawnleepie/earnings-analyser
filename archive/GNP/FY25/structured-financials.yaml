    The Statement of Changes in Equity (financial-statements.pdf p.28) shows "Balance at 1 July 2024:
    Retained earnings $65,418,644, Total equity $121,166,442" (ties exactly to FY24's closing figures),
    followed by "Opening balance adjustment (prior year expenses): Retained earnings $(203,885), Total
    equity $(203,885)" and "Restated balance at 1 July 2024: Retained earnings $65,214,759, Total equity
    $120,962,557". This is the SAME adjustment flagged as unexplained in archive/GNP/FY25H1/structured-financials.yaml
    — but that file recorded the amount as $(203,891), a $6 difference from this year's $(203,885). Both
    immaterial (0.17% of opening equity) — the amount itself is now at least PARTIALLY explained by the
    label "(prior year expenses)" (not disclosed at all in the interim report), but the $6 inter-document
    discrepancy for what should be an identical figure is a new, tiny, unexplained inconsistency, consistent
    with the recurring pattern of small unreconciled figures in GNP's disclosures. Not resolved further from
    the text available.

  segment_structure_change_flag: >
    MAJOR CHANGE THIS PERIOD — segment reporting structure was restructured from the prior 3-segment model
    (Infrastructure / Communications / Industrial Services, stable and reconfirmed through FY23/FY24/FY25H1)
    to a NEW 3-segment model: Infrastructure / Services / Energy & Engineering (financial-statements.pdf p.49,
    Note 5: "The segments and their comparatives have been adjusted to align with management's reporting").
    This is NOT a simple relabelling — actual business-unit content moved between segments:
      - "Energy & Engineering" = former "Industrial Services", UNCHANGED in content (FY24 restated segment
        revenue of $151,565,562 is IDENTICAL to the old "Industrial Services" FY24 figure), now with Partum
        Engineering and Commtel Network Solutions added into it during FY25 (investor-presentation.pdf p.5,15).
      - "Services" = former "Communications" PLUS the Pole Inspection & Nailing division, which was
        TRANSFERRED OUT of Infrastructure into Services this year (investor-presentation.pdf p.13 footnote:
        "Note: Pole inspection and nailing division has been transferred to the Services segment"; p.17
        footnote: "Note: Pole inspection and nailing is included which was previously in the Infrastructure
        segment"). GTS and Arbor West (Classic Tree Services) vegetation-management acquisitions were also
        added into Services during FY25.
      - "Infrastructure" = prior "Infrastructure" LESS the transferred-out Pole Inspection & Nailing division.
    Quantified: restated FY24 comparative revenue is Infrastructure $311,488,758 (down from the old
    $328,946,580 = a $17,457,822 transfer OUT) and Services $88,631,164 (up from the old Communications
    $71,173,341 = a $17,457,823 transfer IN) — an almost exactly offsetting amount, confirming a clean
    reallocation of one business unit (Pole Inspection & Nailing) between the two segments, not a broader
    remix. Energy & Engineering's restated FY24 figure ($151,565,562) is untouched, confirming it is a pure
    relabel of old Industrial Services.
    Investor-presentation.pdf p.4 explicitly cross-labels the new segments against the old ones: "Energy &
    Engineering (Formerly Industrial Services)" and "Services (Formerly Communications)".
    config/companies.yaml's segments field is currently empty ([]) and its existing note already anticipated
    this ("watch for a new/expanded segment breakdown reflecting this [MGC/CommTel diversification]") — see
    extraction_flags for the pending update once the file is unblocked for editing.


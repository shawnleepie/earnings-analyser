  - "GENUINE IMPROVEMENT: unlike FY25H1 (unresolved $409,621 gap in the Appendix 4D Normalised Profit bridge) and FY24H1/FY25H1 (unresolved $160,746/$160,747 gap in the Normalised EBITDA bridge), FY25's FULL-YEAR bridges for BOTH Normalised EBITDA (see pnl.ebitda_normalised.bridge_check) and all three NPAT-underlying variants (see pnl.npat_underlying) reconcile cleanly within immaterial rounding. This is worth noting for the profitability-earnings-analyst as it may indicate the H1 gaps were genuinely half-year-only artifacts (e.g. a timing/estimation issue at the interim reporting date) rather than a persistent quality-of-earnings problem — though three overlapping 'underlying NPAT' variants continue to be disclosed across different documents, which is itself still a disclosure-clarity concern regardless of whether the arithmetic reconciles."
  - "MATERIAL: the Directors' Report (financial-statements.pdf p.3, audited section of the Annual Financial Report) contains a stale, verbatim-copy-pasted sentence stating FY25 net cash is '$77.3 million compared to $22.4 million in 2024' — these are IDENTICAL to FY24's own Directors' Report figures for FY24-vs-FY23 net cash (per archive/GNP/FY24/structured-financials.yaml). The genuine FY25 net cash figure, independently confirmed via the investor presentation's Financial Position table, is $113.5 million (up from a corrected $77.3m FY24 base). This is a disclosure-integrity issue in the audited Directors' Report narrative, not merely an IR-deck slide error — flagged as the most material finding in this extraction for the disclosure-tone-analyst. See balance_sheet.net_debt.directors_report_text_discrepancy_flag."

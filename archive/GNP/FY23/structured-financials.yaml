extraction_flags:
  - "FactSet MCP not accessible this session (authentication required, not completed) — all consensus fields above recorded as not_available rather than sourced from web search or a single broker note, per project guardrails. Re-run consensus pull once FactSet is authorised."
  - "GenusPlus's P&L is presented 'by nature' with no cost-of-sales/gross-profit subtotal anywhere in the financial statements or investor presentation — gross_margin_pct is genuinely not disclosed, not an extraction failure."
  - "GenusPlus discloses THREE distinct 'underlying NPAT' figures for FY23 across its own documents, each excluding a different combination of items, two of which are both labelled 'NPAT-A': (1) Appendix 4E cover 'excl. significant items' $15.59m; (2) Directors' Report table 'NPAT-A' (excl. acquisition-intangible amortisation only) $15.74m; (3) investor presentation Appendix 'Normalised NPAT (labelled NPAT-A)' (excl. both amortisation AND non-recurring costs, plus a prior-year tax adjustment) $16.3m. Flagged as a quality-of-earnings item for the profitability-earnings-analyst — the overlapping/reused 'NPAT-A' label across two different definitions is itself a disclosure-quality observation worth tracking each period."
  - "Segment structure was RE-ALIGNED during FY23 (three segments confirmed: Infrastructure, Communications, Industrial Services) — companies.yaml segments field is currently still `[]` and could NOT be updated in this session (write permission to config/companies.yaml was not granted). The intended update — segments: [\"Infrastructure\", \"Communications\", \"Industrial Services\"] plus a note on the FY23 realignment — should be applied manually or in a session with that permission."
  - "Investor-presentation.pdf segment revenue figures (Infrastructure $320m, Industrial Services $78.7m, Communications $62.3m) are GROSS of inter-segment revenue, whereas the statutory Note 5 external-revenue figures used in this file ($310.8m / $71.2m / $62.2m) are net of inter-segment and reconcile exactly to total Group revenue — the two bases are not directly comparable; primary figures in this file use the statutory net-of-intersegment basis."
  - "Note 41 capital management 'Financial liabilities' input of $21,836,048 (used in the capital-to-overall-financing ratio) does not reconcile cleanly to the sum of the balance-sheet 'Financial liabilities' ($5.86m) and 'Lease liabilities' ($21.87m) lines ($27.73m combined) — nor to investor-presentation.pdf slide 17's own two separate lease-liability sub-lines ($18.4m and $17.3m, which together also don't tie to the statutory $21.87m lease total). Recorded the company's own figures as-is per document; genuine internal disclosure inconsistency rather than an extraction error — worth another look if GNP's next-period accounts restate or clarify this note."
  - "Note 29 Provisions dropped from $1,221,721 (FY22) to $50,000 (FY23) with no narrative given in the note itself explaining the release/utilisation — investor-presentation.pdf slide 15 separately references a fully-provided-for Industrial Services project due for completion in CY2023, which may or may not relate to this movement. Not confirmed."
  - "No growth vs maintenance capex split disclosed — only aggregate PP&E purchases ($5.7m) and a qualitative comment that 'Capex was restrained during FY2023' (investor-presentation.pdf slide 17)."
  - "No separate results-announcement.pdf or transcript.pdf exists for FY23 (already flagged by document-fetcher in metadata.yaml) — commentary/tone extraction for this period relies on the Directors' Report (within financial-statements.pdf) and investor-presentation.pdf only."
  - "This is the oldest archived period for GNP — no prior-period structured-financials.yaml exists, so no HoH/YoY continuity check against a prior archive entry was possible or attempted. FY22 comparatives embedded in this period's statutory accounts should be used as the baseline when the next period (chronologically) is extracted."

  npat_underlying:
    value: not_a_single_figure
    source: null
    note: >
      Recurring quality-of-earnings pattern (also flagged FY23, FY24H1, FY24): this half's IR deck being
      image-only means only ONE normalised-NPAT variant is extractable this period (the Appendix 4D
      "Normalised Profit" figure) rather than the usual 3-4 variants — not because the company converged
      on one measure, but because the supplementary IR-deck variants (NPAT-A, Normalised NPAT-A) are not
      text-extractable this half. Do not read the reduced variant count as improved disclosure discipline.
    variants:
      appendix_4d_normalised_profit:
        value: 14962710
        source: "financial-statements.pdf p.1 (Appendix 4D cover, 'Normalised Profit from ordinary activities after tax'), up 56.28% on pcp"
        pcp_hy24: 9574172
        reconciling_items_after_tax:
          - "Acquisition legal & advisory costs during the period $604,141 (HY24: $1,117,220 including Blue Tongue Energy FV adjustment)"
          - "Net (proceeds)/costs from ECM claim $247,813 (HY24: $(1,147,995))"
          - "Restructure costs NIL (HY24: $555,482)"
        unreconciled_bridge_flag: >
          The disclosed after-tax reconciling items sum to $851,954 (604,141 + 247,813 + 0), which bridges
          statutory NPAT ($13,701,135, Appendix 4D basis) to only $14,553,089 — a full $409,621 SHORT of
          the disclosed Normalised Profit of $14,962,710. This is a genuine, unexplained gap in the
          company's own headline ASX regulatory disclosure (the exact figure that drives the 56.28%
          "up" headline). Tried and ruled out: (a) using pretax rather than after-tax addbacks
          (863,058 + 354,019 = 1,217,077; NPAT + this = 14,918,212, still $44,498 short); (b) tax-effecting
          at the period's own effective rate of 31.8% (results in ~14,531,185, further off). No combination
          of disclosed items reconciles exactly — flagged as an unresolved disclosure-quality item for the
          profitability-earnings-analyst, consistent with the recurring QoE flags raised in every prior
          GNP extraction.
    ir_deck_variants_unavailable: "NPAT-A and Normalised NPAT-A (IR-deck variants used in FY23/FY24H1/FY24 files) not extractable this half — investor-presentation.pdf's relevant slides (equivalent to prior periods' 'Reconciliation of Non-IFRS Financial Information' appendix) returned no text layer."
    flag: "Per the established convention (FY23/FY24H1/FY24), the Appendix 4D 'Normalised Profit' figure remains the primary regulatory disclosure to treat as 'the' underlying NPAT reference point for this period, WITH the caveat that its own bridge from statutory NPAT does not reconcile per the flag above."

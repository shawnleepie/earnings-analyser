document_quality_flag: >
  Directors' Declaration (p.31) contains a stale boilerplate carryover: clause (b) reads "...financial
  position as at 31 December 2023..." despite the document being dated/signed "Perth, 24 February 2025"
  and titled throughout "For the half-year ended 31 December 2024". Same pattern already flagged in
  metadata.yaml and consistent with a documented SKS FY25 boilerplate-carryover issue. Does not affect
  any extracted financial figure — flagged for completeness only.

balance_sheet_continuity_check_vs_FY24_closing:

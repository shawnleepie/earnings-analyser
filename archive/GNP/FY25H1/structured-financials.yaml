    instruction: a $(203,891) "Opening balance adjustment" to retained earnings was recognised in the
    Statement of Changes in Equity between the 30 June 2024 closing position and the 1 July 2024 opening
    position carried into HY25 — see restatement_flag below. All other lines tie exactly (or to $1
    rounding) to archive/GNP/FY24/structured-financials.yaml's closing (30 June 2024) figures.
  items_checked:
    - {item: "Cash (cash equiv + restricted cash)", fy24_closing: 100966681, fy25h1_opening_comparative: 100966681, match: true, note: "86,937,885 unrestricted + 14,028,796 restricted = 100,966,681"}
    - {item: "Total trade and other receivables", fy24_closing: 52023295, fy25h1_opening_comparative: 52023295, match: true}
    - {item: "Trade receivables net of ECL (Note 5/16)", fy24_closing: 49362910, fy25h1_opening_comparative: 49362909, match: true, note: "$1 rounding, immaterial"}
    - {item: "Allowance for ECL on trade receivables", fy24_closing: 206658, fy25h1_opening_comparative: 206658, match: true}
    - {item: "Contract assets", fy24_closing: 39472365, fy25h1_opening_comparative: 39472365, match: true}
    - {item: "Inventory", fy24_closing: 2840598, fy25h1_opening_comparative: 2840598, match: true}
    - {item: "Contract liabilities", fy24_closing: 33384790, fy25h1_opening_comparative: 33384790, match: true}
    - {item: "Intangible assets total", fy24_closing: 30960959, fy25h1_opening_comparative: 30960959, match: true}
    - {item: "Goodwill (Note 12/24 opening balance at cost)", fy24_closing: 22774555, fy25h1_opening_comparative: 22774556, match: true, note: "$1 rounding, immaterial"}
    - {item: "Bank borrowings current", fy24_closing: 1580000, fy25h1_opening_comparative: 1580000, match: true}
    - {item: "Bank borrowings non-current", fy24_closing: 2700000, fy25h1_opening_comparative: 2700000, match: true}
    - {item: "Lease liabilities current", fy24_closing: 10317098, fy25h1_opening_comparative: 10317098, match: true}
    - {item: "Lease liabilities non-current", fy24_closing: 14655827, fy25h1_opening_comparative: 14655827, match: true}
    - {item: "Provisions current", fy24_closing: 65754, fy25h1_opening_comparative: 65754, match: true}
    - {item: "Provisions non-current / relabelled 'Other loans' non-current", fy24_closing: 650000, fy25h1_opening_comparative: 650000, match: true,
       note: "VALUE ties exactly, but the LABEL changed: FY24's own balance sheet showed this $650,000 under 'Provisions' (non-current); FY25H1's comparative column for the identical 30-Jun-2024 date shows the same $650,000 under a new line item 'Other loans' (non-current). This resolves (rather than deepens) the ambiguity FY24's own extraction flagged — that the $650k non-current 'Provisions' balance was suspected to actually be the Blue Tongue Energy contingent consideration (FVTPL) mislabelled. The relabelling to 'Other loans' this half is consistent with that suspicion. Flagged as a presentation reclassification, not a discontinuity."}
    - {item: "Trade and other payables (balance sheet face)", fy24_closing: 75097353, fy25h1_opening_comparative: 75097353, match: true}
    - {item: "Total equity (pre-adjustment)", fy24_closing: 121166442, fy25h1_opening_comparative: 121166442, match: true, note: "See restatement_flag below for the subsequent opening retained-earnings adjustment applied to this balance"}
  restatement_flag: >
    GENUINE (small) restatement identified — flagged per instruction rather than silently accepted:
    the Statement of Changes in Equity (financial-statements.pdf p.10) shows "Balance at 1 July 2024:
    Retained earnings $65,418,644, Total equity $121,166,442" (ties exactly to FY24's closing figures),
    immediately followed by a line "Opening balance adjustment: Retained earnings $(203,891), Total
    equity $(203,891)" and a "Restated Balance at 1 July 2024: Retained earnings $65,214,753, Total
    equity $120,962,551" before HY25's profit is added. No note or narrative in the interim report
    explains the nature of this $203,891 adjustment (it is not flagged as a prior-period error correction,
    accounting policy change, or reclassification in the text available). Immaterial in size (0.17% of
    opening equity) but genuinely unexplained — flagged for the disclosure-tone-analyst / balance-sheet-
    cashflow-analyst to probe if a transcript or subsequent filing sheds light on it.
  net_debt_continuity: {fy24_closing_net_cash: -71713756, fy25h1_opening_comparative_net_cash: -71713756, match: true, note: "Bank borrowings 4,280,000 + leases 24,972,925 - cash 100,966,681, both files"}
  conclusion: "No material restatement, restructure, or extraction error. One small ($203,891) unexplained opening retained-earnings adjustment flagged above; one presentation relabelling (Provisions -> Other loans) flagged as a clarification, not a discontinuity."


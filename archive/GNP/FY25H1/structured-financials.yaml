    pcp_hy24: 21867207
    change_pct_yoy: 25.14
    normalisation_addback_pretax: "Acquisition costs $863,058 (after tax $604,141) + loss from ECM claims $354,019 (after tax $247,813) = $1,217,077 pretax / $851,954 after-tax, per Directors' Report (p.4) and Appendix 4D footnote (p.1). Restructure costs NIL this half (HY24: $555,482 after tax)."
    unreconciled_bridge_flag: >
      The Directors' Report's own EBITDA bridge does not cleanly tie: statutory-equivalent EBITDA
      (Operating profit 19,589,802 + D&A 6,718,785 = 26,308,587) + disclosed pretax normalisations
      (863,058 + 354,019 = 1,217,077) = 27,525,664, which is $160,746 ABOVE the disclosed Normalised
      EBITDA of $27,364,918. The $160,746 gap is suspiciously close to the period's $160,747 "Loss on
      revaluation of investment" (a below-the-line P&L item that sits below Operating profit and
      shouldn't affect an EBITDA build in either direction) — but no note explains this. Recorded as-is;
      flagged as an unresolved internal inconsistency in the company's own EBITDA bridge, consistent
      with the recurring disclosure-quality pattern noted in FY23/FY24H1/FY24.

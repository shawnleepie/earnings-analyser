extraction_flags:
  - "FactSet MCP unavailable this session per explicit instruction — not retried. All consensus fields recorded as not_available rather than sourced from web search or broker notes, per project guardrails."
  - "config/companies.yaml is permission-blocked for editing this session per explicit instruction — not retried. The pending update remains outstanding across FOUR consecutive sessions now (FY23, FY24H1, FY24, FY25H1): segments: [\"Infrastructure\", \"Communications\", \"Industrial Services\"] (reconfirmed stable again this half — 'no changes from the previous reporting period ended 30 June 2024 in the measurement methods used to determine operating segments', financial-statements.pdf p.13 Note 4), plus the FY24-vintage note about the goodwill CGU realignment to match these segments."
  - "investor-presentation.pdf (22 pages) returned an EMPTY or near-empty text layer on the large majority of pages (0 chars on 13 of 22 pages) — confirmed genuinely image-based for its financial-summary and non-IFRS-reconciliation slides, consistent with the document-fetcher's flag in metadata.yaml. Usable text was found on only 2 pages with real financial content: p.3 (segment revenue headline %, cross-checked and consistent with the statutory Note 4 gross-of-intersegment figures) and p.6 (an Orderbook & Pipeline chart whose data-labels extracted as text — cross-checked against FY24's own figures and found consistent). ALL other IR-deck-sourced supplementary metrics available in prior periods (IR-deck EBIT, NPAT-A, Normalised NPAT-A, segment non-IFRS EBITDA/EBIT-A margins, company-reported net debt/net cash bridge, company-disclosed cash-conversion %, shareholder/NTA bridge detail, gearing) are NOT available this period and have been recorded as not_available rather than guessed at, per instruction. financial-statements.pdf (fully text-searchable) is the primary and in most cases sole source for this period's figures."
  - "GENUINE (small) restatement: a $(203,891) unexplained 'Opening balance adjustment' to retained earnings was recognised in the Statement of Changes in Equity between FY24's 30 June 2024 close and the 1 July 2024 opening position carried into HY25 (financial-statements.pdf p.10). No note or narrative explains its nature. Immaterial in size (0.17% of opening equity) but flagged explicitly per instruction rather than silently absorbed — see balance_sheet_continuity_check_vs_FY24_closing.restatement_flag."
  - "Presentation reclassification (not a discontinuity): the $650,000 non-current balance shown as 'Provisions' in FY24's own balance sheet is shown as 'Other loans' in FY25H1's comparative column for the identical 30 June 2024 date. This resolves (in the direction suspected) the ambiguity FY24's own extraction flagged about whether this balance was actually mislabelled contingent consideration."
  - "UNEXPLAINED: current 'Provisions' increased from $65,754 to $744,533 half-on-half (>11x) with no note or narrative explaining the driver — no standalone Provisions note exists in this interim report (consistent with the AASB134 reduced-disclosure pattern already seen in FY24H1, but the sheer size of the swing this half makes the absence of explanation more material than in prior periods). See balance_sheet.provisions.change_flag."
  - "UNRESOLVED internal inconsistency in the company's own Normalised EBITDA bridge: statutory-equivalent EBITDA + disclosed pretax normalisations sums to $160,746 MORE than the disclosed Normalised EBITDA figure of $27,364,918 — the gap is suspiciously close in size to the period's $160,747 'Loss on revaluation of investment' (a below-EBITDA P&L line that should not affect an EBITDA build) but no note confirms this connection. See pnl.ebitda_normalised.unreconciled_bridge_flag."
  - "UNRESOLVED gap in the Appendix 4D 'Normalised Profit' bridge: disclosed after-tax reconciling items ($851,954 total) bridge statutory NPAT to only $14,553,089 — a full $409,621 short of the disclosed Normalised Profit of $14,962,710 (the exact figure underpinning the ASX release's headlined 'Up 56.28%' claim). No combination of pretax/after-tax treatment of the disclosed items closes this gap. See pnl.npat_underlying.variants.appendix_4d_normalised_profit.unreconciled_bridge_flag — this is the most material QoE flag in this extraction, since it means the single most-quoted normalised-earnings figure in the release cannot be independently verified from the company's own footnoted detail."
  - "Statutory AND normalised EBITDA margins both contracted YoY (statutory 9.07% -> 7.91%; normalised 8.75% -> 8.22%) even as revenue grew 33.2% and normalised EBITDA grew 25.1% — the company's own framing (Directors' Report) implicitly concedes this margin dilution by contrasting the two growth rates directly. NPAT margin nonetheless IMPROVED (3.62% -> 4.12%), materially assisted by a ~$1.2m favourable swing in net finance income/expense and a much smaller loss-on-revaluation charge than HY24's Blue Tongue Energy impairment — i.e. below-EBIT items, not operating performance, are doing the work of the NPAT-margin improvement this half. See pnl.ebitda_margin_pct.flag and pnl.npat_statutory.margin_pct.flag."
  - "Net finance position swung from a net EXPENSE ($540,847, HY24) to a net INCOME ($660,589) this half — a genuine ~$1.2m favourable tailwind driven by higher average cash balances, but one that is mechanically a function of the large cash balance that was PARTLY DEPLOYED into the CommTel/Partum acquisitions and capex this half — unlikely to repeat at the same scale on an unchanged cash base going into H2FY25. See pnl.net_interest_income_expense.flag."
  - "Net cash position (statutory basis) DETERIORATED by ~$13.2m half-on-half (-$71.7m net cash at 30 Jun 2024 to -$58.5m at 31 Dec 2024) — driven by $15.8m cash paid for CommTel/Partum, $4.4m dividend, and $8.1m cash capex, only partially offset by $24.5m net operating cash inflow. Company-reported (non-IFRS) net cash figure not available this half for cross-check (IR deck image-only)."

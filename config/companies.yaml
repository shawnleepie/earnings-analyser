s' (the latter being GDG's equity-accounted associate income from Lonsec 49% and Claimfast 0% at FY23) -- plus the non-operating 'Benefit Funds' consolidation segment. Lonsec is not a segment in its own right at FY23; it sits inside 'Other Business'."


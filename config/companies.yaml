omers awaited the new platform) rather than just a subsidiary/narrative item, but it has NOT triggered a segment or revenue-by-type reclassification. Note the Directors' Report now names only TWO product pillars (Kinatico Compliance, Kinatico CVCheck) vs FOUR named at FY25H1 (...+ OnCite + Kinatico Enable) — watch whether OnCite/Enable have been folded into Kinatico Compliance or simply de-emphasised; not yet confirmed either way. Gross margin, which had been contracting FY24H1->FY25 (67.76%->64.07%->64.82%), REVERSED to expand at FY26H1 (64.07% pcp -> 65.86%) as SaaS mix rose past 55% of revenue — a genuine QoE-positive turn worth tracking for persistence into H2 FY26. UPDATE FY26 (year ended 30 Jun 2026, confirmed via that period's own Annual Report, cross-checked against FY26H1): segment structure STILL unchanged (still geographic AU/NZ, Note 5) — no update needed to the segments list itself. The FY26H1 two-vs-four-pillar ambiguity above is RESOLVED: the FY26 Directors' Report reverts to naming FOUR core product offerings again (Kinatico Compliance, Kinatico CVCheck, Kinatico Cited, Kinatico Enable) — presentational only, no segment/revenue-by-type change resulted. Gross margin expansion PERSISTED into the full year (66.05% FY26 vs 64.82% FY25, +1.23pp), confirming the FY26H1 reversal was not a one-off. FY26 is also the first period where the tax line swung to a net BENEFIT ($30,226, vs an expense of $90,897 at FY25), driven by increased Australian tax-loss utilisation — this materially assisted NPAT growth (+78.5%) over PBT growth (+62.75%) and is a genuine sustainability watch-item for FY27, since the unrecognised tax-loss pool funding it is shrinking. Revenue growth decelerated sharply H1->H2 within FY26 across every segment/revenue-type cut (see archive/KYP/FY26/structured-financials.yaml prior_period_continuity_check for the full velocity analysis) — worth checking at FY27H1 whether this was a temporary product-transition effect (as management characterised it) or a more durable slowdown. FY26 Annual Report is also the FIRST period this company has disclosed a company-defined 'Free Cashflow' KPI directly (5-year table) — recommend using the company's own FCF figures for comparability from FY26 onward rather than the narrower analyst-derived FCF methodology used in the FY25 file (see that period's own reconciliation note)."


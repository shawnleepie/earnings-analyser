# Master entity list for earnings-analyser.
# Add new companies here (or via /add-company) — this is the single source of
# truth the fetcher, extractor, and Telegram listener all read from.
#
# Schema per entity:
#   ticker:            exchange ticker as used in the archive/ folder name
#   exchange:           ASX | NZX
#   full_name:          legal/listed name
#   aliases:            free-text names/nicknames the Telegram listener should
#                       match against (people don't type tickers on Telegram)
#   sector:             short sector tag
#   fiscal_year_end:    month, e.g. "June" or "December"
#   reporting_cadence:  half_yearly | quarterly | annual
#   currency:           AUD | NZD
#   ir_page_url:        investor relations landing page
#   announcements_url:  ASX/NZX announcements page for this entity
#   factset_id:         FactSet identifier if known (leave blank if unconfirmed
#                       — do not guess; confirm via FactSet MCP lookup instead)
#   segments:           known reporting segments, for divisional revenue tables
#                       (leave empty list if not yet confirmed)
#   notes:              anything idiosyncratic (seasonality, recent divisional
#                       restructure, one-off items to watch for going forward)


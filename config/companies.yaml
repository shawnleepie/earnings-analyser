# Master entity list for earnings-analyser.
# Mapped from news-crawler's config/cares-list.yaml (Aug 2026) — ticker,
# exchange, full_name, and sector carried over directly from that file.
#
# fiscal_year_end / reporting_cadence / currency were NOT tracked in
# news-crawler (it didn't need them) — these are seeded as exchange-based
# DEFAULTS ONLY (ASX -> June FYE / AUD, NZX -> March FYE / NZD) and are
# explicitly UNCONFIRMED. Don't treat them as fact. document-fetcher always
# verifies the actual period against what each lodged document itself
# states, so a wrong default here gets corrected on first fetch rather than
# silently propagated — but correct it in this file too as you confirm each
# one, so later runs don't repeat the same lookup.
#
# Add new companies via /add-company. Keep this file as the single source
# of truth for earnings-analyser; if news-crawler's cares-list.yaml changes
# (new coverage added/dropped), re-sync manually or ask Claude to diff them.

